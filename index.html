/* =====================================================================
   LeeOn — 05 MOTOR DE ACTIVIDADES (ActivityEngine)
   Un solo motor recibe una actividad (datos) y dibuja el tipo correcto.
   Para agregar una actividad NO se toca este archivo: solo 02-data.js.
   Contrato con el "ctx" que entrega la página de actividad:
     ctx.say(t)          voz por botón (siempre suena)
     ctx.sayAuto(t)      voz de refuerzo (respeta "Sonidos")
     ctx.correct(msg,{final})  respuesta correcta (final:true cierra la actividad)
     ctx.incorrect()     respuesta a revisar (suma intento/error, sin mensajes negativos)
     ctx.info(msg,mood)  mensaje amable que no cuenta como error
     ctx.setRetry(fn)    acción del botón "Intentar nuevamente"
     ctx.setAssist(fn)   ayuda extra a partir de la 2.ª pista
   ===================================================================== */

/* ---------- Arrastrar o tocar (misma acción con dedo, ratón o teclado) ---------- */
function enableDrag(el, o) {
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    let dragging = false, ghost = null;
    const under = ev => { const t = document.elementFromPoint(ev.clientX, ev.clientY); return t ? t.closest(o.dropSel) : null; };
    const cleanup = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', cancel); $$('.over').forEach(x => x.classList.remove('over')); };
    const move = ev => {
      if (ev.pointerId !== pid) return;
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) {
        dragging = true; ghost = el.cloneNode(true); ghost.removeAttribute('id'); ghost.classList.add('ghost'); ghost.style.width = el.offsetWidth + 'px';
        document.body.appendChild(ghost); el.classList.add('dragging');
      }
      if (dragging) {
        ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
        $$('.over').forEach(x => x.classList.remove('over'));
        const t = under(ev); if (t) t.classList.add('over');
      }
    };
    const end = ev => {
      if (ev.pointerId !== pid) return;
      cleanup();
      if (!dragging) { o.onTap(el); return; }
      const t = under(ev);
      if (ghost) ghost.remove();
      el.classList.remove('dragging');
      if (t) o.onDrop(el, t);
    };
    const cancel = () => { cleanup(); if (ghost) ghost.remove(); el.classList.remove('dragging'); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', cancel);
  });
  el.addEventListener('click', e => { if (e.detail === 0) o.onTap(el); });   // Enter / espacio del teclado
}
const wireSay = (host, text, ctx) => $$('[data-say]', host).forEach(b => b.addEventListener('click', () => ctx.say(text)));
const shakeEl = el => { if (el && motionOK()) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } };
const tileSpeak = t => t.speak || (t.label.length === 1 && LETTER_NAME[t.label] ? LETTER_NAME[t.label] : t.label.toLowerCase());

/* ---------- Elección (multiple-choice · image-choice · fill-blank) ---------- */
function choiceCore(host, c, ctx, o) {
  o = o || {};
  const p = c.prompt || {};
  const opts = shuffle(c.options.slice());
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:1.2rem;width:100%';
  let h = '';
  if (p.emoji) h += `<div class="p-emoji" aria-hidden="true">${p.emoji}</div>`;
  if (p.frame) h += `<div class="frame" role="img" aria-label="Palabra con un espacio vacío">${p.frame[0] ? `<span>${esc(p.frame[0])}</span>` : ''}<span class="blank" data-blank>&nbsp;</span>${p.frame[1] ? `<span>${esc(p.frame[1])}</span>` : ''}</div>`;
  if (p.word) h += `<div class="p-word">${esc(p.word)}</div>`;
  if (p.listen) h += `<button type="button" class="btn btn-soft" data-say>🔊 Escuchar</button>`;
  h += `<div class="opts">` + opts.map((op, i) => {
    const showLabel = c.labels !== false || !op.emoji;
    return `<button type="button" class="opt" data-i="${i}" aria-label="${esc(op.label || 'opción ' + (i + 1))}">${op.emoji ? `<span class="o-emoji" aria-hidden="true">${op.emoji}</span>` : ''}${showLabel && op.label ? `<span class="o-label">${esc(op.label)}</span>` : ''}</button>`;
  }).join('') + `</div>`;
  wrap.innerHTML = h;
  host.appendChild(wrap);
  if (p.listen) wireSay(wrap, p.listen, ctx);
  let done = false;
  const btns = $$('.opt', wrap);
  btns.forEach((b, i) => b.addEventListener('click', () => {
    if (done || b.classList.contains('tried')) return;
    const op = opts[i];
    if (op.speak) ctx.say(op.speak);
    if (op.correct) {
      done = true; b.classList.add('right');
      btns.forEach(x => { if (x !== b) x.classList.add('faded'); x.setAttribute('aria-disabled', 'true'); });
      const bl = $('[data-blank]', wrap); if (bl) { bl.textContent = op.label; bl.classList.add('filled'); }
      ctx.correct(o.msg, { final: o.final !== false });
      if (c.result && o.final !== false) setTimeout(() => ctx.sayAuto(c.result), 500);
      if (o.onSolved) o.onSolved();
    } else {
      b.classList.add('tried'); b.setAttribute('aria-disabled', 'true'); shakeEl(b);
      ctx.incorrect();
    }
  }));
  ctx.setRetry(() => { btns.forEach(b => { b.classList.remove('tried', 'assist'); b.removeAttribute('aria-disabled'); }); });
  ctx.setAssist(() => {   // 2.ª pista: se atenúa una opción que no es correcta
    const wrong = btns.filter((b, i) => !opts[i].correct && !b.classList.contains('tried'));
    if (wrong.length > 0 && btns.filter(b => !b.classList.contains('tried') && !b.classList.contains('faded')).length > 2) { wrong[0].classList.add('faded'); }
    else { const r = btns.find((b, i) => opts[i].correct); if (r) r.classList.add('assist'); }
  });
}
function renderChoice(a, host, ctx) { choiceCore(host, a.content, ctx, { final: true }); }

/* ---------- Unir (matching) ---------- */
function renderMatching(a, host, ctx) {
  const pairs = a.content.pairs;
  const L = pairs.map((p, i) => ({ i, it: p.a }));
  const R = shuffleNot(pairs.map((p, i) => ({ i, it: p.b })), x => x.i);
  const item = (side, x) => `<button type="button" class="mi" data-side="${side}" data-i="${x.i}" aria-pressed="false" aria-label="${esc(x.it.label || x.it.speak || 'imagen')}">${x.it.emoji ? `<span class="e" aria-hidden="true">${x.it.emoji}</span>` : ''}${x.it.label ? `<span>${esc(x.it.label)}</span>` : ''}</button>`;
  host.innerHTML = `<div class="match"><div class="col">${L.map(x => item('L', x)).join('')}</div><div class="col">${R.map(x => item('R', x)).join('')}</div></div>`;
  let sel = null, matched = 0;
  const all = $$('.mi', host);
  all.forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('done')) return;
    const side = b.dataset.side, i = +b.dataset.i;
    const it = (side === 'L' ? pairs[i].a : pairs[i].b);
    if (it.speak) ctx.say(it.speak);
    if (sel && sel.el === b) { b.setAttribute('aria-pressed', 'false'); sel = null; return; }
    if (sel && sel.side !== side) {
      const prev = sel; sel = null; prev.el.setAttribute('aria-pressed', 'false');
      if (prev.i === i) {
        matched++;
        [prev.el, b].forEach(x => { x.classList.add('done'); x.setAttribute('aria-disabled', 'true'); x.classList.remove('assist'); x.insertAdjacentHTML('afterbegin', `<span class="num">✓ ${matched}</span>`); });
        ctx.correct(matched < pairs.length ? '¡Muy bien! Sigue con otra pareja.' : null, { final: matched === pairs.length });
      } else { shakeEl(prev.el); shakeEl(b); ctx.incorrect(); }
      return;
    }
    if (sel) sel.el.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-pressed', 'true'); sel = { side, i, el: b };
  }));
  ctx.setRetry(() => { if (sel) { sel.el.setAttribute('aria-pressed', 'false'); sel = null; } });
  ctx.setAssist(() => {
    const idx = pairs.findIndex((p, i) => !$('.mi[data-side="L"][data-i="' + i + '"]', host).classList.contains('done'));
    if (idx >= 0) $$('.mi[data-i="' + idx + '"]', host).forEach(x => x.classList.add('assist'));
  });
}

/* ---------- Clasificar (drag-drop) ---------- */
function renderSort(a, host, ctx) {
  const c = a.content;
  let bank = shuffle(c.items.slice()), selected = null;
  host.innerHTML = `<div class="buckets">${c.buckets.map(b => `<div class="bucket" data-drop="${b.id}" role="button" tabindex="0" aria-label="Caja del sonido ${esc(b.label)}"><div class="bl">${esc(b.label)}</div><div class="chips" data-in="${b.id}"></div></div>`).join('')}</div><p class="muted small" style="margin:0">Arrastra la imagen, o tócala y luego toca la caja.</p><div class="tiles" data-bank></div>`;
  const bankEl = $('[data-bank]', host);
  const place = (id, bid) => {
    const it = c.items.find(x => x.id === id); if (!it) return;
    selected = null;
    if (it.bucket === bid) {
      bank = bank.filter(x => x.id !== id);
      $('[data-in="' + bid + '"]', host).insertAdjacentHTML('beforeend', `<span class="chip">${it.emoji} ${esc(it.label)}</span>`);
      drawBank(); ctx.correct(bank.length ? '¡Muy bien! Sigue con otra imagen.' : null, { final: bank.length === 0 });
    } else { drawBank(); shakeEl($('.tile', bankEl)); ctx.incorrect(); }
  };
  function drawBank() {
    bankEl.innerHTML = bank.map(it => `<button type="button" class="tile${selected === it.id ? ' sel' : ''}" data-id="${it.id}" aria-label="${esc(it.label)}"><span class="te" aria-hidden="true">${it.emoji}</span><span class="tl">${esc(it.label)}</span></button>`).join('');
    $$('.tile', bankEl).forEach(t => enableDrag(t, {
      dropSel: '.bucket',
      onTap: el => { selected = selected === el.dataset.id ? null : el.dataset.id; const it = c.items.find(x => x.id === el.dataset.id); if (it) ctx.say(it.label.toLowerCase()); drawBank(); },
      onDrop: (el, target) => place(el.dataset.id, target.dataset.drop)
    }));
  }
  $$('.bucket', host).forEach(b => {
    const go = () => { if (selected) place(selected, b.dataset.drop); else { const bk = c.buckets.find(x => x.id === b.dataset.drop); if (bk && bk.speak) ctx.say(bk.speak); } };
    b.addEventListener('click', go);
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  drawBank();
  ctx.setRetry(() => { selected = null; drawBank(); });
  ctx.setAssist(() => { if (bank.length) { const it = bank[0]; selected = it.id; drawBank(); const bk = $('.bucket[data-drop="' + it.bucket + '"]', host); if (bk) bk.classList.add('over'); } });
}

/* ---------- Armar (letras · sílabas · palabras · frases) ---------- */
/* o = { answer:[tok], pool:[tok], words:bool, equation:bool, result:'CASA', prompt, onSolved } */
function builderCore(host, o, ctx) {
  host.insertAdjacentHTML('beforeend', `<div class="slots${o.words ? ' words' : ''}" data-slots></div><div class="result-line" data-res aria-live="polite"></div><div class="tiles${o.words ? ' words' : ''}" data-tiles></div><p class="muted small" style="margin:0">Arrastra las piezas, o tócalas para ponerlas en orden.</p>`);
  const slotsEl = $('[data-slots]', host), tilesEl = $('[data-tiles]', host), resEl = $('[data-res]', host);
  let slots = o.answer.map(() => null), locked = false, checking = false;
  const tiles = shuffleNot(o.pool.map(t => Object.assign({}, t, { u: uid('t') })), t => t.k);
  const inner = t => `${t.emoji ? `<span class="te" aria-hidden="true">${t.emoji}</span>` : ''}<span class="${t.emoji ? 'tl' : ''}">${esc(t.label)}</span>`;
  function draw() {
    slotsEl.innerHTML = slots.map((t, i) => `<button type="button" class="slot${t ? ' filled' : ''}${locked ? ' good' : ''}${checking ? ' check' : ''}" data-slot="${i}" aria-label="${t ? 'Espacio ' + (i + 1) + ': ' + esc(t.label) + '. Toca para quitar' : 'Espacio ' + (i + 1) + ' vacío'}">${t ? inner(t) : ''}</button>`).join('');
    tilesEl.innerHTML = tiles.filter(t => slots.indexOf(t) < 0).map(t => `<button type="button" class="tile" data-u="${t.u}" aria-label="${esc(t.label)}">${inner(t)}</button>`).join('');
    $$('.tile', tilesEl).forEach(el => enableDrag(el, { dropSel: '.slot', onTap: e => put(e.dataset.u), onDrop: (e, t) => put(e.dataset.u, +t.dataset.slot) }));
    $$('.slot', slotsEl).forEach(s => s.addEventListener('click', () => {
      if (locked) return; const i = +s.dataset.slot;
      if (slots[i]) { slots[i] = null; checking = false; draw(); }
    }));
  }
  function put(u, idx) {
    if (locked) return;
    const t = tiles.find(x => x.u === u); if (!t) return;
    const i = idx != null ? idx : slots.indexOf(null); if (i < 0) return;
    slots[i] = t; checking = false;
    ctx.say(tileSpeak(t));
    draw();
    if (slots.every(Boolean)) check();
  }
  function check() {
    const ok = slots.every((t, i) => t.k === o.answer[i].k);
    if (ok) {
      locked = true; draw();
      resEl.textContent = o.equation ? o.answer.map(t => t.label).join(' + ') + ' = ' + o.result : o.result;
      ctx.correct(null, { final: true });
      setTimeout(() => ctx.sayAuto(o.spoken || o.result), 500);
      if (o.onSolved) o.onSolved();
    } else { checking = true; draw(); shakeEl(slotsEl); ctx.incorrect(); }
  }
  ctx.setRetry(() => { if (locked) return; slots = o.answer.map(() => null); checking = false; draw(); });
  ctx.setAssist(() => {   // 2.ª pista: se coloca la primera pieza que falta
    if (locked) return;
    const i = o.answer.findIndex((a, n) => !slots[n] || slots[n].k !== a.k); if (i < 0) return;
    const t = tiles.find(x => x.k === o.answer[i].k && !(slots.indexOf(x) >= 0 && slots.indexOf(x) < o.answer.length && slots[slots.indexOf(x)].k === o.answer[slots.indexOf(x)].k));
    if (!t) return;
    const j = slots.indexOf(t); if (j >= 0) slots[j] = null;
    slots[i] = t; checking = false; draw();
    if (slots.every(Boolean)) check();
  });
  draw();
}
function renderBuilder(a, host, ctx) {
  const c = a.content, p = c.prompt || {};
  const answer = c.answer.map(k => tok(k));
  const pool = answer.concat((c.distractors || []).map(k => tok(k)));
  host.innerHTML = `${p.emoji ? `<div class="p-emoji" aria-hidden="true">${p.emoji}</div>` : ''}<button type="button" class="btn btn-soft" data-say>🔊 Escuchar</button>`;
  wireSay(host, p.listen || c.result, ctx);
  builderCore(host, { answer, pool, words: c.joiner === ' ', equation: c.equation, result: c.result, spoken: p.listen && c.joiner === ' ' ? p.listen : c.result }, ctx);
}

/* ---------- Comprensión lectora ---------- */
function renderComprehension(a, host, ctx) {
  const c = a.content, n = c.questions.length;
  let qi = 0;
  host.innerHTML = `<div class="p-emoji" aria-hidden="true">${c.emoji}</div><div class="textcard">${c.sentences.map(s => `<span class="sent">${esc(s)}</span>`).join('')}</div><button type="button" class="btn btn-soft" data-say>🔊 Escuchar el texto</button><div class="qbox" data-q></div>`;
  wireSay(host, c.sentences.join(' '), ctx);
  const qbox = $('[data-q]', host);
  function show() {
    const q = c.questions[qi];
    qbox.innerHTML = `<div class="qcount">Pregunta ${qi + 1} de ${n}</div><h3>${esc(q.q)}</h3><button type="button" class="btn btn-soft btn-sm" data-sayq>🔊 Escuchar pregunta</button><div data-qopts style="width:100%"></div>`;
    $('[data-sayq]', qbox).addEventListener('click', () => ctx.say(q.q));
    const last = qi === n - 1;
    choiceCore($('[data-qopts]', qbox), { prompt: {}, options: q.options, result: '' }, ctx, {
      final: last, msg: last ? null : '¡Muy bien! Vamos con la siguiente pregunta.',
      onSolved: () => { if (!last) setTimeout(() => { qi++; show(); }, 1200); }
    });
  }
  show();
}

/* ---------- Escritura guiada (varias formas de escribir) ---------- */
function renderWrite(a, host, ctx) {
  const c = a.content, modes = c.modes || ['keyboard'];
  const LABEL = { keyboard: '⌨️ Escribir', letters: '🔤 Con letras', words: '🧩 Con palabras', pictos: '🖼️ Con imágenes', complete: '✏️ Completar' };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  host.innerHTML = `${c.emoji ? `<div class="p-emoji" aria-hidden="true">${c.emoji}</div>` : ''}${c.showModel ? `<div class="model" aria-label="Modelo">${esc(c.model)}</div>` : ''}<button type="button" class="btn btn-soft" data-say>🔊 Escuchar</button><div class="modes" data-modes role="group" aria-label="Elige cómo escribir">${modes.map(m => `<button type="button" class="btn" data-m="${m}" aria-pressed="false">${LABEL[m]}</button>`).join('')}</div><div data-body style="width:100%;display:flex;flex-direction:column;align-items:center;gap:1.2rem"></div>`;
  wireSay(host, c.showModel ? c.model.toLowerCase() : (c.model || '').toLowerCase(), ctx);
  const body = $('[data-body]', host), modeBtns = $$('[data-m]', host);
  const acceptSet = (c.accept || []).map(norm);
  const isRight = v => {
    v = norm(v); if (!v) return false;
    if (acceptSet.indexOf(v) >= 0) return true;
    return !!(c.contains && c.contains.every(w => v.indexOf(w) >= 0) && v.split(' ').length >= (c.minWords || 1));
  };
  const lock = () => modeBtns.forEach(b => { b.disabled = true; });
  const wrapFinal = ctx2 => Object.assign({}, ctx2, { correct: (m, o) => { lock(); ctx2.correct(m, o); } });
  const M = {
    keyboard() {
      body.innerHTML = `<input class="write-in" type="text" data-wi autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escribe aquí" placeholder="Escribe aquí"><div class="row center"><button type="button" class="btn btn-green" data-check>✔ Comprobar</button>${SR ? '<button type="button" class="btn btn-soft" data-mic>🎤 Decir</button>' : ''}</div>`;
      const wi = $('[data-wi]', body); let k = 0;
      const go = () => {
        if (!wi.value.trim()) { ctx.info('Escribe algo y toca Comprobar.', 'encouraging'); return; }
        if (isRight(wi.value)) { wi.disabled = true; lock(); ctx.correct(null, { final: true }); ctx.sayAuto(wi.value); }
        else ctx.incorrect();
      };
      $('[data-check]', body).addEventListener('click', go);
      wi.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      const mic = $('[data-mic]', body);
      if (mic) mic.addEventListener('click', () => {
        try { const r = new SR(); r.lang = 'es-ES'; r.onresult = e => { wi.value = e.results[0][0].transcript; }; r.onerror = () => ctx.info('No pude escuchar. Puedes escribir con el teclado.', 'encouraging'); r.start(); }
        catch (e) { ctx.info('El dictado no está disponible aquí. Puedes escribir con el teclado.', 'encouraging'); }
      });
      ctx.setRetry(() => { wi.focus(); });
      ctx.setAssist(() => { k = Math.min(c.model.length, k + 1); wi.value = c.model.slice(0, k).toLowerCase(); wi.focus(); });
    },
    letters() {
      const chars = c.model.replace(/ /g, '').split('');
      builderCore(body, { answer: chars.map(x => tok(x)), pool: chars.concat(c.distractors || []).map(x => tok(x)), result: c.model }, wrapFinal(ctx));
    },
    words() {
      const ws = c.model.split(' ');
      builderCore(body, { answer: ws.map(x => tok(x)), pool: ws.concat(c.wordBank || c.distractors || []).map(x => tok(x)), words: true, result: c.model + (ws.length > 1 ? '.' : ''), spoken: c.model.toLowerCase() }, wrapFinal(ctx));
    },
    pictos() {
      const pc = c.pictos;
      const byK = {}; pc.options.forEach(o => { byK[o.k] = o; });
      builderCore(body, { answer: pc.answer.map(k => tok(k, { emoji: byK[k].emoji, label: byK[k].label })), pool: pc.options.map(o => tok(o.k, { emoji: o.emoji, label: o.label })), words: true, result: c.model, spoken: c.model.toLowerCase() }, wrapFinal(ctx));
    },
    complete() {
      const f = c.frame;
      choiceCore(body, { prompt: { emoji: '', frame: [f.before, f.after] }, options: f.options, result: c.model }, wrapFinal(ctx), { final: true });
    }
  };
  function setMode(m) {
    modeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
    body.innerHTML = ''; ctx.setRetry(null); ctx.setAssist(null);
    M[m]();
  }
  modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
  setMode(modes[0]);
}

/* ---------- Trazo de letras (canvas) ---------- */
function renderTracing(a, host, ctx) {
  const c = a.content;
  host.innerHTML = `<div class="modes" data-modes role="group" aria-label="Elige cómo hacerlo"><button type="button" class="btn" data-m="trace" aria-pressed="true">✏️ Trazar</button><button type="button" class="btn" data-m="pick" aria-pressed="false">🔤 Elegir la letra</button></div><div data-body style="width:100%;display:flex;flex-direction:column;align-items:center;gap:1rem"></div>`;
  const body = $('[data-body]', host), mb = $$('[data-m]', host);
  function pickMode() {
    body.innerHTML = '';
    choiceCore(body, { prompt: { emoji: '🔊', listen: 'La letra ' + c.name }, options: c.pool.map(L => oLetter(L, L === c.letter)), result: c.name }, ctx, { final: true });
  }
  function traceMode() {
    body.innerHTML = `<button type="button" class="btn btn-soft" data-say>🔊 Escuchar</button><div class="trace-box" data-tb><canvas data-cg aria-hidden="true"></canvas><canvas data-cd role="img" aria-label="Espacio para trazar la letra ${esc(c.letter)}"></canvas></div><div style="width:100%;max-width:440px">${bar(0, 'green', 'Cuánto has repasado')}</div><div class="row center"><button type="button" class="btn btn-soft" data-clear>🧽 Borrar</button><button type="button" class="btn btn-green" data-done>✔ Ya terminé</button></div>`;
    wireSay(body, 'La letra ' + c.name, ctx);
    const box = $('[data-tb]', body), cg = $('[data-cg]', body), cd = $('[data-cd]', body);
    const W_ = box.clientWidth || 360, H_ = box.clientHeight || Math.round(W_ * 0.9), dpr = Math.min(window.devicePixelRatio || 1, 2);
    let g, d;
    try { g = cg.getContext('2d'); d = cd.getContext('2d'); } catch (e) { g = null; }
    if (!g || !d) { ctx.info('Aquí no se puede trazar. Elige la letra.', 'encouraging'); mb[1].click(); return; }
    [cg, cd].forEach(cv => { cv.width = Math.round(W_ * dpr); cv.height = Math.round(H_ * dpr); });
    g.setTransform(dpr, 0, 0, dpr, 0, 0); d.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fs = Math.round(H_ * 0.9), font = '700 ' + fs + 'px Andika, "Comic Sans MS", Arial, sans-serif';
    const place = cx => { cx.font = font; cx.textAlign = 'center'; cx.textBaseline = 'alphabetic'; const m = cx.measureText(c.letter); const asc = m.actualBoundingBoxAscent || fs * 0.72, dsc = m.actualBoundingBoxDescent || 0; return H_ / 2 + (asc - dsc) / 2; };
    const y0 = place(g);
    g.fillStyle = 'rgba(120,140,190,.30)'; g.fillText(c.letter, W_ / 2, y0);
    g.setLineDash([8, 8]); g.lineWidth = 3; g.strokeStyle = 'rgba(91,111,168,.9)'; g.strokeText(c.letter, W_ / 2, y0);
    // máscara de la letra: celdas de 6 px que deben quedar cubiertas
    const CS = 6, cols = Math.ceil(W_ / CS), rows = Math.ceil(H_ / CS), mask = new Uint8Array(cols * rows), cov = new Uint8Array(cols * rows);
    let total = 0, covered = 0;
    try {
      const oc = document.createElement('canvas'); oc.width = W_; oc.height = H_;
      const ox = oc.getContext('2d'); ox.fillStyle = '#000'; const yy = place(ox); ox.fillText(c.letter, W_ / 2, yy);
      const img = ox.getImageData(0, 0, W_, H_).data;
      for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
        const px = Math.min(W_ - 1, q * CS + CS / 2) | 0, py = Math.min(H_ - 1, r * CS + CS / 2) | 0;
        if (img[(py * W_ + px) * 4 + 3] > 100) { mask[r * cols + q] = 1; total++; }
      }
    } catch (e) { total = 0; }
    if (!total) { ctx.info('Aquí no se puede trazar. Elige la letra.', 'encouraging'); mb[1].click(); return; }
    const ink = (getComputedStyle(document.documentElement).getPropertyValue('--blue') || '#1D64CF').trim() || '#1D64CF';
    const R = 16, fillBar = $('.bar > i', body);
    let drawing = false, last = null, finished = false;
    const mark = (x, y) => {
      for (let r = Math.max(0, Math.floor((y - R) / CS)); r <= Math.min(rows - 1, Math.floor((y + R) / CS)); r++)
        for (let q = Math.max(0, Math.floor((x - R) / CS)); q <= Math.min(cols - 1, Math.floor((x + R) / CS)); q++) {
          const i = r * cols + q;
          if (mask[i] && !cov[i] && Math.hypot(q * CS + CS / 2 - x, r * CS + CS / 2 - y) <= R) { cov[i] = 1; covered++; }
        }
    };
    const pt = e => { const b = cd.getBoundingClientRect(); return { x: (e.clientX - b.left) * (W_ / b.width), y: (e.clientY - b.top) * (H_ / b.height) }; };
    const seg = (p, q) => {
      d.strokeStyle = ink; d.lineWidth = 22; d.lineCap = 'round'; d.lineJoin = 'round'; d.globalAlpha = 0.85;
      d.beginPath(); d.moveTo(p.x, p.y); d.lineTo(q.x, q.y); d.stroke();
      const n = Math.max(1, Math.ceil(Math.hypot(q.x - p.x, q.y - p.y) / 4));
      for (let i = 0; i <= n; i++) mark(p.x + (q.x - p.x) * i / n, p.y + (q.y - p.y) * i / n);
      const pct = Math.round(100 * covered / total); if (fillBar) fillBar.style.width = Math.min(100, Math.round(pct / 0.6)) + '%';
      if (!finished && covered / total >= 0.6) finish();
    };
    const finish = () => { finished = true; drawing = false; ctx.correct('¡Lo trazaste muy bien!', { final: true }); mb.forEach(b => { b.disabled = true; }); };
    cd.addEventListener('pointerdown', e => { if (finished) return; e.preventDefault(); drawing = true; try { cd.setPointerCapture(e.pointerId); } catch (x) { /* nada */ } last = pt(e); seg(last, last); ctx.tick(); });
    cd.addEventListener('pointermove', e => { if (!drawing || finished) return; const p = pt(e); seg(last, p); last = p; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cd.addEventListener(ev, () => { drawing = false; }));
    $('[data-clear]', body).addEventListener('click', () => { if (finished) return; d.clearRect(0, 0, W_, H_); cov.fill(0); covered = 0; if (fillBar) fillBar.style.width = '0%'; });
    $('[data-done]', body).addEventListener('click', () => {
      if (finished) return;
      if (covered / total >= 0.6) finish(); else ctx.info('Casi lo tienes. Sigue el contorno de la letra con calma.', 'encouraging');
    });
    ctx.setRetry(() => { $('[data-clear]', body).click(); });
    ctx.setAssist(null);
  }
  mb.forEach(b => b.addEventListener('click', () => {
    mb.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    ctx.setRetry(null); ctx.setAssist(null);
    b.dataset.m === 'trace' ? traceMode() : pickMode();
  }));
  traceMode();
}

/* ---------- Registro de tipos ---------- */
const Engine = {
  renderers: {
    'multiple-choice': renderChoice, 'image-choice': renderChoice, 'fill-blank': renderChoice,
    'matching': renderMatching, 'drag-drop': renderSort,
    'ordering': renderBuilder, 'syllable-builder': renderBuilder, 'word-builder': renderBuilder, 'sentence-builder': renderBuilder,
    'reading-comprehension': renderComprehension, 'guided-write': renderWrite, 'tracing': renderTracing
  },
  mount(activity, host, ctx) {
    const fn = this.renderers[activity.type];
    if (!fn) throw new Error('Tipo de actividad desconocido: ' + activity.type);
    host.innerHTML = '';
    fn(activity, host, ctx);
  }
};

function loginStudent(id) {
  const st = getStudent(id); if (!st) return errorView();
  setStudentSession(id); st.lastAccess = new Date().toISOString(); saveStudents(); applyPrefs();
  go(st.avatarChosen === false ? '#/student/avatar' : '#/student/dashboard');
}
ACT.login = el => loginStudent(el.dataset.id);
ACT['login-code'] = () => {
  const v = ($('#code-in').value || '').trim();
  const st = getStudents().find(s => s.code === v);
  if (st) loginStudent(st.id); else { $('#code-err').textContent = 'No encontré ese código. Prueba otra vez o toca tu nombre.'; }
};
ACT.logout = () => { Voice.stop(); setStudentSession(null); applyPrefs(); go('#/'); };

/* ---------- Página de un módulo ---------- */
const STATUS_TXT = {
  completed: ['ok', '✓ Hecha'], 'in-progress': ['try', '▶ Seguir'], reinforcement: ['try', '💪 Practicar'], locked: ['lock', '🔒 Pronto'], available: ['', '⭐ Nueva']
};
function viewModule(st, mid) {
  const M = MOD[mid]; if (!M) return errorView();
  const sm = statusMap(st), unl = unlockedLevel(st, mid), rec = recommendNextActivity(st.id);
  const p = getStudentProgress(st.id).modules[mid];
  let secs = '';
  for (let L = 1; L <= 5; L++) {
    const list = actsOf(mid, L), lks = linksOf(mid, L);
    const linkCards = lks.map(l => {
      const locked = L > unl, did = resultsFor(st.id).some(r => r.activityId === l.id && r.completed);
      return `<button type="button" class="act-card" data-act="open-link" data-id="${l.id}" ${locked ? 'aria-disabled="true"' : ''}><span class="ic" aria-hidden="true">${esc(l.icon)}</span><span class="t">${esc(l.title)}</span><span class="meta"><span class="pill">🔗 Otra página</span><span class="pill ${locked ? 'lock' : did ? 'ok' : ''}">${locked ? '🔒 Pronto' : did ? '✓ Hecha' : '⭐ Nueva'}</span></span>${did ? '<span class="small muted">🔁 Practicar de nuevo</span>' : ''}</button>`;
    }).join('');
    secs += `<section class="level-sec" aria-label="Nivel ${L}"><h2>${L > unl ? '🔒' : '🎯'} Nivel ${L} · ${esc(LEVEL_NAMES[mid][L - 1])}</h2><div class="grid g3">${list.map(a => {
      const s = sm[a.id], t = STATUS_TXT[s], isRec = rec && rec.activity.id === a.id && s !== 'locked';
      return `<button type="button" class="act-card${isRec ? ' reco-on' : ''}" data-act="open-act" data-id="${a.id}" ${s === 'locked' ? 'aria-disabled="true"' : ''}>${isRec ? '<span class="ribbon">🦁 Recomendada</span>' : ''}<span class="ic" aria-hidden="true">${a.icon}</span><span class="t">${esc(a.title)}</span><span class="meta"><span class="pill">${DIFF[a.difficulty]}</span><span class="pill ${t[0]}">${t[1]}</span></span>${s === 'completed' ? '<span class="small muted">🔁 Practicar de nuevo</span>' : ''}</button>`;
    }).join('')}${linkCards}</div></section>`;
  }
  show(`<main id="main" class="wrap">${studentBar(st)}
    <div class="mhead mod-${M.cls}"><div class="row" style="justify-content:space-between"><h1>${M.icon} ${M.short}</h1><button type="button" class="btn btn-sm" data-go="#/student/dashboard">← Volver</button></div><p style="margin:.2rem 0 .6rem">${M.name} · ${M.desc}</p>${bar(p.pct, '', M.name)}<p style="margin:.4rem 0 0" class="small">⭐ ${p.done} de ${p.total} actividades</p></div>
    <div class="row center" style="margin:1rem 0">${lionAssistant('encouraging', 'Elige tu misión', 'Puedes escoger cualquiera que esté abierta', 100)}</div>
    ${secs}</main>`);
}
ACT['open-act'] = el => {
  if (el.getAttribute('aria-disabled') === 'true') { toast('Completa 2 actividades del nivel anterior para abrir esta.', '🦁'); return; }

function viewLink(st, id) {

  if (!isGeneral && l.level > unlockedLevel(st, l.module)) { toast('Esa actividad todavía está cerrada.', '🔒'); return go('#/student/module/' + l.module); }
  const M = MOD_ALL[l.module], backHash = isGeneral ? '#/student/dashboard' : '#/student/module/' + l.module;
  const did = resultsFor(st.id).filter(r => r.activityId === l.id && r.completed).length;
  show(`<div class="abar"><button type="button" class="btn btn-sm btn-ghost" data-go="#/student/dashboard">🏠 Inicio</button><button type="button" class="btn btn-sm btn-ghost" data-go="${backHash}">← Volver</button><div class="atitle">${M.icon} ${M.short}${isGeneral ? '' : ' · Nivel ' + l.level} · 🔗 Otra página</div><button type="button" class="btn btn-sm btn-ghost" data-act="a11y" aria-label="Accesibilidad">⚙️</button></div>
    <main id="main" class="awrap">
      <section class="card ins"><p class="instruction">Vas a jugar en otra página. Cuando termines, vuelve aquí.</p><button type="button" class="btn btn-soft" id="say-ins">🔊 Escuchar instrucción</button></section>
      <section class="card stage" style="text-align:center">
        <div class="p-emoji" aria-hidden="true">${esc(l.icon)}</div><h2 style="margin:0">${esc(l.title)}</h2>
        ${did ? `<span class="pill ok">✓ Ya la hiciste ${did > 1 ? did + ' veces' : ''}</span>` : ''}
        <a class="btn btn-orange btn-xl" id="l-open" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">▶ Abrir actividad</a>
        <div class="stack" id="l-after" hidden><p class="muted" style="margin:0">Cuando termines, vuelve a esta pantalla.</p><button type="button" class="btn btn-green btn-xl" id="l-done">✔ Ya terminé</button></div>
      </section>
      <div id="done"></div>
      <div class="row center" style="margin-top:1rem">${lionAssistant('happy', '¡Vamos paso a paso!', 'Toca Abrir para empezar', 90)}</div>

    $('#l-done', root).addEventListener('click', () => {
      const secs = openedAt ? Math.min(1200, (Date.now() - openedAt) / 1000) : 1;   // tiempo aproximado (máx. 20 min)
      const fresh = recordLinkParticipation(st.id, l, secs, openedAt ? new Date(openedAt).toISOString() : null).fresh;
      sfx(fresh.length ? 'badge' : 'ok'); fresh.forEach(f => toast('¡Nuevo logro! ' + f.name, f.emoji));
      $('#l-after', root).hidden = true;
      $('#done', root).innerHTML = `<section class="card done-card" aria-live="polite">${lionFig('celebrating', 130, true)}<h2>¡Muy bien!</h2><p class="muted">🦁 Lo registré. ¡LeeOn está orgulloso de tu esfuerzo!</p>${fresh.length ? `<div class="newach">${fresh.map(f => `<span class="pill ok">${f.emoji} ¡Nuevo logro! ${esc(f.name)}</span>`).join('')}</div>` : ''}<div class="row center"><button type="button" class="btn btn-green" data-go="${backHash}">🗺️ Elegir misión</button><button type="button" class="btn btn-soft" id="b-again">🔁 Practicar de nuevo</button></div></section>`;

/* ---------- Actividad ---------- */
const PRAISE = ['¡Excelente!', '¡Muy bien!', '¡Lo estás logrando!', '¡Excelente trabajo!', '¡Tú puedes!'];
const TRYMSG = ['Casi lo tienes. Vamos a intentarlo otra vez.', '¡Inténtalo otra vez!', 'Vamos paso a paso.'];
const GENERIC_HINTS = ['Mira con calma y escucha otra vez.', 'Toca 🔊 para oírlo de nuevo. Tú puedes.', 'Te ayudo un poquito más.'];

function viewActivity(id, preview) {
  const a = actById(id), st = currentStudent();
  if (!a) return show(emptyState('🦁', 'Ups. No encontré esa actividad.', 'Vamos a volver al inicio.', '🏠 Inicio', preview ? '#/teacher/activities' : '#/student/dashboard'));
  if (!preview) {
    if (!st) return go('#/student');
    if (statusMap(st)[a.id] === 'locked') { toast('Esa actividad todavía está cerrada.', '🔒'); return go('#/student/module/' + a.module); }
  }
  const M = MOD[a.module];
  const list = ACTIVITIES.filter(x => x.module === a.module);
  const sm = st && !preview ? statusMap(st) : null;
  const idx = list.findIndex(x => x.id === a.id);
  const openable = x => !sm || sm[x.id] !== 'locked';
  const prev = list.slice(0, idx).reverse().find(openable), next = list.slice(idx + 1).find(openable);
  const homeHash = preview ? '#/teacher/activities' : '#/student/dashboard';
  const backHash = preview ? '#/teacher/activities' : '#/student/module/' + a.module;

  show(`<div class="abar"><button type="button" class="btn btn-sm btn-ghost" data-go="${homeHash}">🏠 Inicio</button><button type="button" class="btn btn-sm btn-ghost" data-go="${backHash}">← Volver</button><div class="atitle">${M.icon} ${M.short} · Nivel ${a.level} · ${DIFF[a.difficulty]}${preview ? ' · Vista previa' : ''}</div><button type="button" class="btn btn-sm btn-ghost" data-act="a11y" aria-label="Accesibilidad">⚙️</button></div>
    <main id="main" class="awrap">
      <section class="card ins" aria-label="Instrucción"><p class="instruction">${esc(a.instruction)}</p><button type="button" class="btn btn-soft" id="say-ins">🔊 Escuchar instrucción</button></section>
      <section class="card stage" id="stage" aria-label="Actividad"></section>
      <div id="done"></div>
      <div class="dock"><div class="fb" id="fb"><span id="fb-lion"></span><div class="msg" id="fb-msg" role="status" aria-live="polite"></div><div class="acts" id="fb-acts"></div></div>
        <div class="afoot"><button type="button" class="btn btn-soft" id="b-hint">💡 Pista</button><button type="button" class="btn btn-soft" id="b-repeat">🔁 Repetir</button>
        ${prev ? `<button type="button" class="btn btn-ghost" data-go="#/${preview ? 'teacher/preview' : 'student/activity'}/${prev.id}">◀ Anterior</button>` : ''}${next ? `<button type="button" class="btn btn-ghost" data-go="#/${preview ? 'teacher/preview' : 'student/activity'}/${next.id}">Siguiente ▶</button>` : ''}</div></div>
    </main>`, root => {
    const fbEl = $('#fb', root), fbMsg = $('#fb-msg', root), fbActs = $('#fb-acts', root), fbLion = $('#fb-lion', root);
    const sess = { startedAt: new Date().toISOString(), last: Date.now(), active: 0, attempts: 0, errors: 0, hints: 0, hintIdx: 0, consec: 0, completed: false, saved: false };
    let retryFn = null, assistFn = null;
    const tick = () => { const n = Date.now(); sess.active += Math.min(n - sess.last, 45000); sess.last = n; };

    /* --- Retroalimentación (sin mensajes negativos) --- */
    function setFb(mood, msg, kind, acts) {
      fbLion.innerHTML = lionFig(mood, 64, false);
      fbMsg.textContent = msg; fbEl.className = 'fb ' + (kind || '');
      fbActs.innerHTML = '';
      (acts || []).forEach(k => {
        if (k === 'retry' && !retryFn) return;
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-sm btn-soft';
        b.textContent = k === 'hint' ? '💡 Pista' : k === 'listen' ? '🔊 Escuchar' : '🔄 Intentar nuevamente';
        b.addEventListener('click', () => { if (k === 'hint') doHint(false); else if (k === 'listen') speak(a.audioText || a.instruction, { user: true }); else { if (retryFn) retryFn(); setFb('happy', 'Vamos otra vez. ¡Tú puedes!', ''); } });
        fbActs.appendChild(b);
      });
    }
    function doHint(auto) {
      tick(); sess.hints++;
      const hs = a.hints && a.hints.length ? a.hints : GENERIC_HINTS;
      const text = hs[Math.min(sess.hintIdx, hs.length - 1)];
      if (sess.hintIdx >= 1 && assistFn) { try { assistFn(); } catch (e) { /* nada */ } }
      sess.hintIdx++;
      setFb('thinking', (auto ? 'Te ayudo con una pista. ' : '') + text, 'soft', ['listen', 'retry']);
      speak(text, { user: !auto });
    }
    const ctx = {
      tick, say: t => speak(t, { user: true }), sayAuto: t => speak(t),
      setRetry: f => { retryFn = f; }, setAssist: f => { assistFn = f; },
      info: (m, mood) => setFb(mood || 'encouraging', m, 'soft'),
      correct: (msg, o) => {
        if (sess.completed) return;
        tick(); sess.attempts++; sess.consec = 0;
        if (o && o.final) finish(); else { setFb('celebrating', msg || pick(PRAISE), 'good'); sfx('ok'); }
      },
      incorrect: () => {
        if (sess.completed) return;
        tick(); sess.attempts++; sess.errors++; sess.consec++; sfx('soft');
        if (sess.consec >= 3) { sess.consec = 0; doHint(true); }
        else setFb('encouraging', pick(TRYMSG), 'soft', ['hint', 'listen', 'retry']);
      }
    };

    function makeResult(completed) {
      const score = completed ? clamp(100 - 15 * sess.errors - 6 * sess.hints, 40, 100) : 0;
      return { id: uid('res'), studentId: st.id, activityId: a.id, module: a.module, score, attempts: sess.attempts, errors: sess.errors, hintsUsed: sess.hints, completed, durationSeconds: Math.max(1, Math.round(sess.active / 1000)), startedAt: sess.startedAt, completedAt: completed ? new Date().toISOString() : undefined };
    }
    function finish() {
      sess.completed = true; tick();
      const score = clamp(100 - 15 * sess.errors - 6 * sess.hints, 40, 100), stars = score >= 85 ? 3 : score >= 65 ? 2 : 1;
      let fresh = [];
      if (!preview && st) { fresh = recordActivityResult(makeResult(true)).fresh; sess.saved = true; }
      setFb('celebrating', pick(PRAISE), 'good'); fbActs.innerHTML = '';
      sfx(fresh.length ? 'badge' : 'ok');
      fresh.forEach(f => toast('¡Nuevo logro! ' + f.name, f.emoji));
      const rec = !preview && st ? recommendNextActivity(st.id) : null;
      const nextAct = rec && rec.activity.id !== a.id ? rec.activity : (next || null);
      $('#done', root).innerHTML = `<section class="card done-card" aria-live="polite">${lionFig('celebrating', 130, true)}<h2>${preview ? '¡Actividad resuelta!' : '¡Excelente trabajo!'}</h2>
        <div class="stars" role="img" aria-label="${stars} estrellas">${Array.from({ length: stars }).map(() => '<span>⭐</span>').join('')}</div>
        ${preview ? '<p class="muted small">Vista previa: este resultado no se guarda.</p>' : '<p class="muted">🦁 ¡LeeOn está orgulloso de tu esfuerzo!</p>'}
        ${fresh.length ? `<div class="newach">${fresh.map(f => `<span class="pill ok">${f.emoji} ¡Nuevo logro! ${esc(f.name)}</span>`).join('')}</div>` : ''}
        ${nextAct && !preview ? `<div class="small">🦁 LeeOn te recomienda: <b>${esc(nextAct.title)}</b></div>` : ''}
        <div class="row center">${nextAct ? `<button type="button" class="btn btn-green" data-go="#/${preview ? 'teacher/preview' : 'student/activity'}/${nextAct.id}">▶ Siguiente actividad</button>` : ''}<button type="button" class="btn btn-soft" id="b-again">🔁 Practicar de nuevo</button><button type="button" class="btn btn-soft" data-go="${backHash}">🗺️ ${preview ? 'Volver' : 'Elegir misión'}</button></div></section>`;
      $('#b-again', root).addEventListener('click', () => viewActivity(a.id, preview));
      const d = $('#done .done-card', root); if (d && d.scrollIntoView) d.scrollIntoView({ behavior: motionOK() ? 'smooth' : 'auto', block: 'nearest' });
    }

    /* --- Botones fijos --- */
    $('#say-ins', root).addEventListener('click', () => speak(a.audioText || a.instruction, { user: true }));
    $('#b-hint', root).addEventListener('click', () => { if (!sess.completed) doHint(false); });
    $('#b-repeat', root).addEventListener('click', () => speak(Voice.last || a.audioText || a.instruction, { user: true }));

    setFb('happy', '¡Vamos paso a paso!', '');
    try { Engine.mount(a, $('#stage', root), ctx); }
    catch (e) { console.error(e); $('#stage', root).innerHTML = `<div class="empty">${lionFig('thinking', 110)}<p>Ups. Vamos a volver a intentarlo.</p><button type="button" class="btn btn-blue" data-go="${backHash}">← Volver</button></div>`; }
    if (prefs().autoRead) setTimeout(() => speak(a.audioText || a.instruction), 400);

    /* Al salir: si hubo intentos sin terminar, se guarda como "en progreso" (nunca se penaliza el tiempo) */
    view.cleanup = () => {
      Voice.stop();
      if (!preview && st && !sess.completed && !sess.saved && sess.attempts > 0) { tick(); saveActivityResult(makeResult(false)); const s2 = getStudent(st.id); if (s2) { s2.lastAccess = new Date().toISOString(); saveStudents(); } }
    };
  });
}

/* ---------- Mi progreso: camino donde avanza el león ---------- */
function viewProgress(st) {
  const prog = getStudentProgress(st.id), rec = recommendNextActivity(st.id), sm = statusMap(st), an = getStudentAnalytics(st.id);
  const paths = MOD_ORDER.map(m => {
    const M = MOD[m];
    const nodes = actsOf(m).map((a, i) => {
      const s = sm[a.id], isNext = rec && rec.activity.id === a.id;
      const cls = s === 'completed' || (s === 'reinforcement' && st.completedActivities.includes(a.id)) ? 'done' : s === 'locked' ? 'lockd' : '';
      const face = cls === 'done' ? '✓' : s === 'locked' ? '🔒' : String(i + 1);
      return `<button type="button" class="node ${cls}${isNext ? ' next' : ''}" data-act="open-act" data-id="${a.id}" ${s === 'locked' ? 'aria-disabled="true"' : ''} aria-label="${esc(a.title)}: ${cls === 'done' ? 'hecha' : s === 'locked' ? 'cerrada' : 'abierta'}">${isNext ? `<span class="lionpin">${lionSVG('happy')}</span>` : ''}${face}${i % 3 === 0 ? `<span class="lvl">Nivel ${a.level}</span>` : ''}</button>`;
    }).join('');
    return `<section class="path-row" aria-label="Camino de ${M.short}"><h3>${M.dot} ${M.short}</h3><div class="path">${nodes}</div></section>`;
  }).join('');
  show(`<main id="main" class="wrap">${studentBar(st)}
    <h1>⭐ Mi progreso</h1>
    <div style="margin-bottom:1rem">${lionAssistant('celebrating', 'Has completado ' + prog.completed + (prog.completed === 1 ? ' actividad.' : ' actividades.'), '¡Sigue así, paso a paso!', 120)}</div>
    ${rec ? `<section class="card reco" style="margin-bottom:1rem"><div class="em" aria-hidden="true">${rec.activity.icon}</div><div style="flex:1;min-width:180px"><div class="small">Tu próximo reto es…</div><h3 style="margin:.1rem 0">${esc(rec.activity.title)}</h3></div><button type="button" class="btn btn-orange" data-go="#/student/activity/${rec.activity.id}">▶ Continúa desde aquí</button></section>` : ''}
    <div class="card" style="margin-bottom:1rem">${MOD_ORDER.map(m => barLine(MOD[m].short, prog.modules[m].pct, MOD[m].cls)).join('<div style="height:.5rem"></div>')}</div>
    <div class="grid g4" style="margin-bottom:1.4rem">
      <div class="card stat"><b>${prog.completed}</b>actividades hechas</div>
      <div class="card stat"><b>${an.accuracy}%</b>aciertos</div>
      <div class="card stat"><b>${an.attempts}</b>intentos</div>
      <div class="card stat"><b>${st.achievements.length}</b>logros ⭐</div></div>
    <h2>Mi camino</h2><p class="muted small">Toca un círculo para jugar. El león te muestra dónde seguir.</p>${paths}
    <div class="row center"><button type="button" class="btn btn-soft" data-go="#/student/achievements">🏅 Ver mis logros</button><button type="button" class="btn btn-soft" data-go="#/student/dashboard">🗺️ Elegir misión</button></div></main>`);
}

/* ---------- Formulario de estudiante (crear / editar) ---------- */
function studentForm(pf, st) {
  const av = st ? st.avatarId : 'lion';
  const lvlNames = ['Empieza desde el inicio', 'Ya reconoce sonidos', 'Reconoce sonido final', 'Trabaja con sílabas', 'Lee y escribe palabras'];
  return `<label class="fl" for="${pf}-name">Nombre (solo nombre de pila o apodo)</label><input class="f" id="${pf}-name" maxlength="20" autocomplete="off" value="${st ? esc(st.name) : ''}">
    <label class="fl" for="${pf}-code">Código (4 números)</label><div class="row"><input class="f" id="${pf}-code" inputmode="numeric" maxlength="4" autocomplete="off" style="flex:1;min-width:120px" value="${st ? esc(st.code) : ''}"><button type="button" class="btn btn-soft btn-sm" data-act="gen-code" data-pf="${pf}">🎲 Crear código</button></div>
    <label class="fl">Avatar</label><div class="row" id="${pf}-av" role="group" aria-label="Avatar">${AVATARS.map(a => `<button type="button" class="av-tile" data-av="${a.id}" aria-pressed="${a.id === av}" style="padding:.4rem" aria-label="${a.name}">${avatarHTML(a.id, 52)}</button>`).join('')}</div>
    <label class="fl" for="${pf}-lvl">Nivel inicial</label><select class="f" id="${pf}-lvl">${[1, 2, 3, 4, 5].map(n => `<option value="${n}"${st && st.level === n ? ' selected' : ''}>Nivel ${n} · ${lvlNames[n - 1]}</option>`).join('')}</select>
    ${st ? '' : `<label class="fl" for="${pf}-obs">Observaciones (opcional)</label><textarea class="f" id="${pf}-obs" rows="2" maxlength="300" placeholder="Ej.: Necesita apoyo visual"></textarea>`}
    <div class="err" id="${pf}-err" role="alert"></div><p class="small muted">No escribas apellidos, datos médicos ni diagnósticos.</p>`;
}
function wireStudentForm(root, pf) {
  $$('#' + pf + '-av .av-tile', root).forEach(b => b.addEventListener('click', () => { $$('#' + pf + '-av .av-tile', root).forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
}
ACT['gen-code'] = el => {
  const pf = el.dataset.pf; let c, n = 0;
  do { c = String(Math.floor(1000 + Math.random() * 9000)); n++; } while (getStudents().some(s => s.code === c) && n < 50);
  $('#' + pf + '-code').value = c;
};
function readStudentForm(pf, selfId) {
  const name = ($('#' + pf + '-name').value || '').trim(), code = ($('#' + pf + '-code').value || '').trim();
  const avBtn = $('#' + pf + '-av .av-tile[aria-pressed="true"]'), lvl = +$('#' + pf + '-lvl').value;
  const obsEl = $('#' + pf + '-obs'), err = $('#' + pf + '-err');
  let msg = '';
  if (!name) msg = 'Escribe el nombre del estudiante.';
  else if (!/^\d{4}$/.test(code)) msg = 'El código debe tener 4 números.';
  else if (getStudents().some(s => s.code === code && s.id !== selfId)) msg = 'Este código ya está siendo utilizado. Usa 🎲 Crear código.';
  if (msg) { err.textContent = msg; return null; }
  return { name, code, avatarId: avBtn ? avBtn.dataset.av : 'lion', level: lvl, obs: obsEl ? obsEl.value.trim() : '' };
}

/* ---------- Estudiantes ---------- */
function viewTStudents() {
  const sts = sortedStudents();
  const rows = sts.map(s => { const p = getStudentProgress(s.id); return `<tr><td><div class="row" style="flex-wrap:nowrap">${avatarHTML(s.avatarId, 40)}<b>${esc(s.name)}</b></div></td><td>${esc(s.code)}</td><td>Nivel ${p.level}</td><td>${p.avg}%</td><td><div class="row"><button type="button" class="btn btn-sm btn-soft" data-go="#/teacher/students/${s.id}">Ver</button><button type="button" class="btn btn-sm btn-ghost" data-act="edit-st" data-id="${s.id}">✏️ Editar</button><button type="button" class="btn btn-sm btn-danger" data-act="del-st" data-id="${s.id}">🗑️ Eliminar</button></div></td></tr>`; }).join('');
  show(tShell('students', `<h1>👥 Estudiantes</h1>
    <div class="card" style="margin-bottom:1.2rem;max-width:640px"><h2>➕ Agregar estudiante</h2>${studentForm('new')}<button type="button" class="btn btn-green" data-act="add-st">➕ Agregar estudiante</button></div>
    ${sts.length ? `<div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Código</th><th>Nivel</th><th>Progreso</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="card empty">Todavía no hay estudiantes.</div>'}`),
    root => wireStudentForm(root, 'new'));
}
ACT['add-st'] = () => {
  const f = readStudentForm('new', null); if (!f) return;
  const st = addStudent({ name: f.name, code: f.code, avatarId: f.avatarId, level: f.level, observations: f.obs ? [{ id: uid('ob'), date: new Date().toISOString(), text: f.obs, teacherId: 'docente-1' }] : [] });
  showToast('Estudiante agregado: ' + st.name + '.', 'success'); viewTStudents();
};
ACT['edit-st'] = el => {
  const st = getStudent(el.dataset.id); if (!st) return;
  const m = openModal({
    title: '✏️ Editar estudiante', html: studentForm('ed', st),
    actions: [{ label: 'Cancelar', cls: 'btn-soft' }, {
      label: '✔ Guardar', cls: 'btn-green', onClick: () => {
        const f = readStudentForm('ed', st.id); if (!f) return false;
        updateStudent(st.id, { name: f.name, code: f.code, avatarId: f.avatarId, level: f.level });
        showToast('Estudiante actualizado.', 'success'); route();
      }
    }]
  });
  wireStudentForm(m.el, 'ed');
};
ACT['del-st'] = async el => {
  const st = getStudent(el.dataset.id); if (!st) return;
  if (await confirmDialog('🗑️ Eliminar estudiante', '¿Seguro que deseas eliminar este estudiante? (' + esc(st.name) + ') También se borrarán sus resultados.', 'Sí, eliminar', 'No, cancelar')) {
    deleteStudent(st.id); showToast('Estudiante eliminado.', 'success'); route();
  }
};

/* ---------- Historial (tabla) ---------- */
function historyRows(sid, f) {
  const reinfIds = new Set(getActivitiesNeedingReinforcement(sid).map(r => r.activity.id));
  return resultsFor(sid).slice().reverse().filter(r => {
    const a = resultActivity(r); if (!a) return false;
    if (f.module && a.module !== f.module) return false;
    if (f.level && a.level !== +f.level) return false;
    if (f.status === 'completed' && !r.completed) return false;
    if (f.status === 'incomplete' && r.completed) return false;
    if (f.status === 'reinforcement' && !reinfIds.has(a.id)) return false;
    return true;
  }).map(r => ({ r, a: resultActivity(r), flag: reinfIds.has(r.activityId) }));
}
function historyTable(rows, withName) {
  if (!rows.length) return '<div class="card empty">No hay registros con estos filtros.</div>';
  return `<div class="tablewrap"><table><thead><tr><th>Fecha</th>${withName ? '<th>Estudiante</th>' : ''}<th>Módulo</th><th>Actividad</th><th>Resultado</th><th>Intentos</th><th>Pistas</th><th>Duración</th><th>Puntaje</th></tr></thead><tbody>${rows.map(x => `<tr><td>${fmtDateShort(x.r.startedAt)}</td>${withName ? `<td>${esc((getStudent(x.r.studentId) || {}).name || '?')}</td>` : ''}<td>${MOD_ALL[x.a.module].name}</td><td>${x.r.link ? '🔗 ' : ''}${esc(x.a.title)}<br><span class="small muted">${x.r.link ? 'Enlace externo' : x.a.id + ' · ' + esc(x.a.skill)}</span></td><td>${x.r.link ? '✓ Terminó (enlace)' : x.r.completed ? '✓ Completada' : 'En progreso'}${x.flag ? '<br><span class="pill try">🟡 Requiere práctica</span>' : ''}</td><td>${x.r.link ? '—' : x.r.attempts}</td><td>${x.r.link ? '—' : x.r.hintsUsed}</td><td>${fmtDur(x.r.durationSeconds)}</td><td>${x.r.link || !x.r.completed ? '—' : x.r.score + '%'}</td></tr>`).join('')}</tbody></table></div>`;
}
const filterSelects = (f, pf, withStudent) => `<div class="filters">${withStudent ? `<label>Estudiante<select class="f" data-f="student"><option value="">Todos</option>${sortedStudents().map(s => `<option value="${s.id}"${f.student === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` : ''}
  <label>Módulo<select class="f" data-f="module"><option value="">Todos</option>${MOD_ORDER.concat(['general']).map(m => `<option value="${m}"${f.module === m ? ' selected' : ''}>${MOD_ALL[m].name}</option>`).join('')}</select></label>
  <label>Nivel<select class="f" data-f="level"><option value="">Todos</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}"${String(f.level) === String(n) ? ' selected' : ''}>Nivel ${n}</option>`).join('')}</select></label>
  <label>Estado<select class="f" data-f="status"><option value="">Todos</option><option value="completed"${f.status === 'completed' ? ' selected' : ''}>Completadas</option><option value="incomplete"${f.status === 'incomplete' ? ' selected' : ''}>Pendientes / en progreso</option><option value="reinforcement"${f.status === 'reinforcement' ? ' selected' : ''}>Requieren refuerzo</option></select></label></div>`;

function tallyHTML(skills) {
  if (!skills.length) return '<p class="muted">Sin datos todavía.</p>';
  return skills.slice().sort((a, b) => a.skill.localeCompare(b.skill, 'es')).map(s => {
    const t = s.ok + s.not, pct = t ? Math.round(100 * s.ok / t) : 0;
    return `<div class="tally"><span class="nm">${esc(s.skill)}</span><div class="seg" role="img" aria-label="${s.ok} logradas, ${s.not} por practicar"><i class="g" style="width:${pct}%"></i><i class="y" style="width:${100 - pct}%"></i></div><span class="small" style="min-width:8.5rem">✓ ${s.ok} &nbsp; ○ ${s.not}${pct < 60 && t >= 2 ? ' 🟡' : ''}</span></div>`;
  }).join('');
}

/* ---------- Perfil detallado del estudiante ---------- */

  const st = getStudent(id);
  if (!st) return show(tShell('students', `<div class="card empty"><h2>No encontré a ese estudiante</h2><button type="button" class="btn btn-blue" data-go="#/teacher/students">← Estudiantes</button></div>`));
  const p = getStudentProgress(id), an = getStudentAnalytics(id), f = tState.hist;
  show(tShell('students', `<div class="row" style="justify-content:space-between;margin-bottom:1rem"><button type="button" class="btn btn-sm btn-ghost" data-go="#/teacher/students">← Estudiantes</button><div class="row"><button type="button" class="btn btn-sm btn-soft" data-act="edit-st" data-id="${st.id}">✏️ Editar</button><button type="button" class="btn btn-sm btn-soft" data-act="csv-one" data-id="${st.id}">📄 Exportar CSV</button></div></div>
    <div class="card row" style="margin-bottom:1rem">${avatarHTML(st.avatarId, 90)}<div><h1 style="margin:0">${esc(st.name)}</h1><div>Nivel ${p.level} · Código ${esc(st.code)}</div><div class="muted small">Último acceso: ${relDay(an.lastAccess)}</div></div></div>
    <div class="grid g2" style="margin-bottom:1rem"><div class="card"><h2>Progreso por módulo</h2>${MOD_ORDER.map(m => barLine(MOD[m].short, p.modules[m].pct, MOD[m].cls)).join('<div style="height:.5rem"></div>')}</div>
      <div class="card"><h2>Datos generales</h2><div class="grid g3">
        <div class="kpi"><span class="n">${an.totalResults}</span>Actividades realizadas</div><div class="kpi"><span class="n">${an.distinctDone}</span>Completadas</div><div class="kpi"><span class="n">${an.attempts}</span>Intentos</div>
        <div class="kpi"><span class="n">${an.accuracy}%</span>Aciertos</div><div class="kpi"><span class="n">${an.hints}</span>Pistas usadas</div><div class="kpi"><span class="n">${fmtDur(an.timeSec)}</span>Tiempo aprox.</div><div class="kpi"><span class="n">${an.linksDone}</span>🔗 Enlaces terminados</div></div></div></div>
    <div class="grid g2" style="margin-bottom:1rem"><div class="card"><h2>🟡 Requiere práctica</h2>${an.reinforcement.length ? `<ul class="notes">${an.reinforcement.map(x => `<li><b>${esc(x.activity.title)}</b> <span class="small muted">(${esc(x.activity.skill)})</span><br><span class="small">${x.info.reasons.join(' · ')}</span></li>`).join('')}</ul>` : '<p class="muted">Nada por ahora.</p>'}<p class="small muted">Orientación pedagógica, no un diagnóstico.</p>
      ${an.patterns.length ? `<h3>Patrones observados</h3><ul class="notes">${an.patterns.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>
      <div class="card"><h2>Habilidades</h2>${tallyHTML(an.skills)}<p class="small muted">✓ logradas · ○ por practicar</p></div></div>
    <h2>Historial de actividades</h2>${filterSelects(f, 'h', false)}<div id="hist">${historyTable(historyRows(id, f), false)}</div>
    <div class="card" style="margin-top:1.4rem"><h2>📝 Observaciones</h2><label class="fl" for="obs-t" style="margin-top:0">Nueva observación</label><textarea class="f" id="obs-t" rows="2" maxlength="300" placeholder="Escribir observación…"></textarea><div class="row" style="margin:.6rem 0"><button type="button" class="btn btn-green btn-sm" data-act="add-obs" data-id="${st.id}">Guardar</button></div>
      ${st.observations.length ? `<ul class="notes">${st.observations.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).map(o => `<li><b>${fmtDate(o.date)}</b><br>“${esc(o.text)}” <button type="button" class="btn btn-sm btn-ghost" style="min-height:40px" data-act="del-obs" data-id="${st.id}" data-ob="${o.id}" aria-label="Borrar observación">✖</button></li>`).join('')}</ul>` : '<p class="muted">Aún no hay observaciones.</p>'}</div>`),
    root => {
      $$('[data-f]', root).forEach(s => s.addEventListener('change', () => { tState.hist[s.dataset.f] = s.value; $('#hist', root).innerHTML = historyTable(historyRows(id, tState.hist), false); }));
    });

ACT['add-obs'] = el => {
  const t = ($('#obs-t').value || '').trim(); if (!t) return;
  const st = getStudent(el.dataset.id); if (!st) return;
  st.observations.push({ id: uid('ob'), date: new Date().toISOString(), text: t, teacherId: 'docente-1' });
  saveStudents(); toast('Observación guardada', '📝'); viewTStudent(st.id);
};
ACT['del-obs'] = async el => {
  const st = getStudent(el.dataset.id); if (!st) return;
  if (await confirmDialog('Borrar observación', '¿Seguro que deseas borrar esta observación?', 'Sí, borrar', 'Cancelar')) { st.observations = st.observations.filter(o => o.id !== el.dataset.ob); saveStudents(); viewTStudent(st.id); }
};

/* ---------- Progreso del grupo ---------- */
function viewTProgress() {
  const sts = sortedStudents();
  const lvlRows = MOD_ORDER.map(m => `<div class="card"><h3>${MOD[m].dot} ${MOD[m].name}</h3>${[1, 2, 3, 4, 5].map(L => {
    const list = actsOf(m, L), tot = list.length * sts.length;
    const done = sum(sts.map(s => list.filter(a => s.completedActivities.includes(a.id)).length));
    return barLine('Nivel ' + L, tot ? 100 * done / tot : 0, MOD[m].cls);
  }).join('<div style="height:.4rem"></div>')}<p class="small muted">${LEVEL_NAMES[m].map((n, i) => (i + 1) + ' ' + n).join(' · ')}</p></div>`).join('');
  show(tShell('progress', `<h1>📊 Progreso</h1>
    <h2>Por estudiante</h2>${sts.length ? `<div class="tablewrap"><table><thead><tr><th>Estudiante</th>${MOD_ORDER.map(m => `<th>${MOD[m].short}</th>`).join('')}<th>Promedio</th></tr></thead><tbody>${sts.map(s => { const p = getStudentProgress(s.id); return `<tr><td><a href="#/teacher/students/${s.id}"><b>${esc(s.name)}</b></a></td>${MOD_ORDER.map(m => `<td class="mini">${bar(p.modules[m].pct, MOD[m].cls, MOD[m].name)}<span class="small">${p.modules[m].done}/${p.modules[m].total} · ${p.modules[m].pct}%</span></td>`).join('')}<td>${p.avg}%</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="card empty">Sin estudiantes.</div>'}
    <h2 style="margin-top:1.4rem">Por nivel (todo el grupo)</h2><div class="grid g3">${lvlRows}</div>`));
}

  show(tShell('activities', `<h1>📝 Actividades</h1><p class="muted">${ACTIVITIES.length} actividades. Usa <b>Probar</b> para verlas como las ve el estudiante (no se guarda ningún resultado).</p>
    <div class="filters"><label>Módulo<select class="f" data-f="module"><option value="">Todos</option>${MOD_ORDER.map(m => `<option value="${m}"${f.module === m ? ' selected' : ''}>${MOD[m].name}</option>`).join('')}</select></label>
    <label>Nivel<select class="f" data-f="level"><option value="">Todos</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}"${String(f.level) === String(n) ? ' selected' : ''}>Nivel ${n}</option>`).join('')}</select></label></div>
    <div class="tablewrap"><table><thead><tr><th>ID</th><th>Actividad</th><th>Habilidad y objetivo</th><th>Dificultad</th><th>Tipo</th><th>Completada por</th><th></th></tr></thead><tbody>${list.map(a => `<tr><td>${a.id}</td><td><b>${esc(a.title)}</b><br><span class="small muted">${MOD[a.module].short} · Nivel ${a.level}</span></td><td><b>${esc(a.skill)}</b><br><span class="small">${esc(a.objective)}</span></td><td>${DIFF[a.difficulty]}</td><td class="small">${a.type}</td><td>${sts.filter(s => s.completedActivities.includes(a.id)).length} de ${sts.length}</td><td><button type="button" class="btn btn-sm btn-soft" data-go="#/teacher/preview/${a.id}">▶ Probar</button></td></tr>`).join('')}</tbody></table></div>`),

/* ---------- Enlaces externos (Wordwall, Genially, etc.) ---------- */
const LINK_ICONS = ['🔗', '🎮', '🧩', '📺', '🎵', '🔤', '🧠', '⭐'];
function linkForm(pf, l) {
  const ic = l ? l.icon : '🔗', mod = l ? l.module : 'reading', lvl = l ? l.level : 1;
  return `<label class="fl" for="${pf}-title" style="margin-top:0">Título (lo que verá el niño)</label><input class="f" id="${pf}-title" maxlength="40" autocomplete="off" placeholder="Ej.: Sopa de letras con M" value="${l ? esc(l.title) : ''}">
    <label class="fl" for="${pf}-url">Dirección de la página (enlace)</label><input class="f" id="${pf}-url" inputmode="url" autocomplete="off" placeholder="https://wordwall.net/resource/…" value="${l ? esc(l.url) : ''}">
    <div class="row"><label class="fl" style="flex:1;min-width:180px">Módulo<select class="f" id="${pf}-mod" data-mod-select>${MOD_ORDER.concat(['general']).map(m => `<option value="${m}"${m === mod ? ' selected' : ''}>${MOD_ALL[m].dot} ${MOD_ALL[m].name}</option>`).join('')}</select></label>
    <label class="fl" style="flex:1;min-width:140px" id="${pf}-lvl-wrap">Nivel<select class="f" id="${pf}-lvl">${[1, 2, 3, 4, 5].map(n => `<option value="${n}"${n === lvl ? ' selected' : ''}>Nivel ${n}</option>`).join('')}</select></label></div>
    <p class="small muted" id="${pf}-mod-note" style="margin-top:-.3rem"></p>
    <label class="fl">Ícono</label><div class="row" id="${pf}-ic" role="group" aria-label="Ícono">${LINK_ICONS.map(i => `<button type="button" class="av-tile" data-ic="${i}" aria-pressed="${i === ic}" style="padding:.3rem .8rem;font-size:1.8rem" aria-label="Ícono ${i}">${i}</button>`).join('')}</div>
    <div class="err" id="${pf}-err" role="alert"></div>`;
}
function wireLinkForm(root, pf) {
  $$('#' + pf + '-ic .av-tile', root).forEach(b => b.addEventListener('click', () => { $$('#' + pf + '-ic .av-tile', root).forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
  const modSel = $('#' + pf + '-mod', root), lvlWrap = $('#' + pf + '-lvl-wrap', root), note = $('#' + pf + '-mod-note', root);
  const syncMod = () => {
    const isGeneral = modSel.value === 'general';
    lvlWrap.style.display = isGeneral ? 'none' : '';
    note.textContent = isGeneral ? 'Los enlaces "General" aparecen siempre en el tablero del estudiante, sin importar el nivel.' : '';
  };
  modSel.addEventListener('change', syncMod); syncMod();
}
function readLinkForm(pf) {
  const title = ($('#' + pf + '-title').value || '').trim(), url = normalizeUrl($('#' + pf + '-url').value), err = $('#' + pf + '-err');
  const ic = $('#' + pf + '-ic .av-tile[aria-pressed="true"]');
  let msg = '';
  if (!title) msg = 'Escribe un título.';
  else if (!url) msg = 'Escribe un enlace válido. Copia la dirección completa, por ejemplo https://wordwall.net/…';
  if (msg) { err.textContent = msg; return null; }
  const module = $('#' + pf + '-mod').value;
  return { title, url, module, level: module === 'general' ? 1 : +$('#' + pf + '-lvl').value, icon: ic ? ic.dataset.ic : '🔗' };
}
function viewTLinks() {
  const ls = getLinks(), sts = getStudents();
  const rows = ls.map(l => {
    const n = new Set(getActivityResults().filter(r => r.activityId === l.id && r.completed).map(r => r.studentId)).size;
    return `<tr><td><span aria-hidden="true">${esc(l.icon)}</span> <b>${esc(l.title)}</b></td><td>${MOD_ALL[l.module].dot} ${MOD_ALL[l.module].short}${l.module === 'general' ? '' : ' · Nivel ' + l.level}</td><td class="small">${esc(linkHost(l.url))}</td><td>${n} de ${sts.length}</td><td><div class="row"><a class="btn btn-sm btn-soft" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">▶ Probar</a><button type="button" class="btn btn-sm btn-ghost" data-act="edit-link" data-id="${l.id}">✏️ Editar</button><button type="button" class="btn btn-sm btn-danger" data-act="del-link" data-id="${l.id}">🗑️ Eliminar</button></div></td></tr>`;
  }).join('');

/* =====================================================================
   LeeOn — 07a ACCESO DEL DOCENTE (contraseña)
   El panel docente solo se abre con una contraseña que crea el docente
   la primera vez. Se guarda únicamente una HUELLA (SHA-256 con sal,
   repetida 5000 veces), nunca la contraseña.
   Además hay un código de recuperación (se muestra una sola vez).

   ⚠️ Límite honesto: LeeOn es un prototipo SIN servidor. La contraseña
   impide que los niños entren al panel, pero alguien con conocimientos
   técnicos y acceso al dispositivo podría leer los datos del navegador.
   Para uso institucional se necesita un backend con autenticación real.
   ===================================================================== */

/* ---------- SHA-256 (JavaScript puro, funciona también sin HTTPS) ---------- */
const SHA_K = (() => {
  const k = []; let n = 2;
  while (k.length < 64) { let p = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { p = false; break; } if (p) k.push(Math.floor((Math.cbrt(n) % 1) * 4294967296)); n++; }
  return k;
})();
function utf8Bytes(s) {
  const out = [], e = encodeURIComponent(s);
  for (let i = 0; i < e.length; i++) { if (e[i] === '%') { out.push(parseInt(e.substr(i + 1, 2), 16)); i += 2; } else out.push(e.charCodeAt(i)); }
  return out;
}
function sha256(str) {
  const H = [2, 3, 5, 7, 11, 13, 17, 19].map(n => Math.floor((Math.sqrt(n) % 1) * 4294967296));
  const b = utf8Bytes(str), bitLen = b.length * 8;
  b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  const hi = Math.floor(bitLen / 4294967296), lo = bitLen >>> 0;
  b.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255, (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
  const w = new Array(64), rot = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < b.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (b[o + 4 * i] << 24) | (b[o + 4 * i + 1] << 16) | (b[o + 4 * i + 2] << 8) | b[o + 4 * i + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rot(w[i - 15], 7) ^ rot(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rot(w[i - 2], 17) ^ rot(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rot(e, 6) ^ rot(e, 11) ^ rot(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + SHA_K[i] + w[i]) | 0;
      const S0 = rot(a, 2) ^ rot(a, 13) ^ rot(a, 22), mj = (a & bb) ^ (a & c) ^ (bb & c), t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
}
function randHex(n) {
  const a = new Uint8Array(n);
  try { window.crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.from(a).map(x => ('0' + x.toString(16)).slice(-2)).join('');
}
function hashSecret(secret, salt) { let h = salt + '|' + secret; for (let i = 0; i < 5000; i++) h = sha256(h + salt); return h; }

/* ---------- Servicio de contraseña ---------- */
const MIN_PASS = 6;
const hasTeacherAuth = () => { const a = lsRead(KEYS.teacherAuth, null); return !!(a && a.salt && a.hash); };
function setTeacherPassword(pass) {
  const a = lsRead(KEYS.teacherAuth, null) || {};
  a.salt = randHex(16); a.hash = hashSecret(pass, a.salt);
  lsWrite(KEYS.teacherAuth, a);
}
function checkTeacherPassword(pass) {
  const a = lsRead(KEYS.teacherAuth, null); if (!a || !a.salt) return false;
  return hashSecret(pass, a.salt) === a.hash;
}
/* Código de recuperación: se muestra UNA vez; solo se guarda su huella. */
function newRecoveryCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', raw = Array.from({ length: 12 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
  const a = lsRead(KEYS.teacherAuth, null) || {};
  a.rsalt = randHex(16); a.rhash = hashSecret(raw, a.rsalt);
  lsWrite(KEYS.teacherAuth, a);
  return raw.replace(/(.{4})(?=.)/g, '$1-');
}
function checkRecoveryCode(code) {
  const a = lsRead(KEYS.teacherAuth, null); if (!a || !a.rsalt) return false;
  return hashSecret(String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), a.rsalt) === a.rhash;
}
/* Tras 5 intentos fallidos se espera 60 segundos */
function lockSecondsLeft() { const l = lsRead(KEYS.teacherLock, null); return l && l.until > Date.now() ? Math.ceil((l.until - Date.now()) / 1000) : 0; }
function registerFail() {
  const l = lsRead(KEYS.teacherLock, null) || { fails: 0, until: 0 };
  if (l.until && l.until <= Date.now()) { l.fails = 0; l.until = 0; }   // el bloqueo anterior ya terminó
  l.fails++;
  if (l.fails >= 5) { l.until = Date.now() + 60000; l.fails = 0; }
  lsWrite(KEYS.teacherLock, l);
}
const clearFails = () => lsRemove(KEYS.teacherLock);

function factoryReset() {
  Object.keys(KEYS).forEach(k => lsRemove(KEYS[k]));
  bootDB();
}

    actions: [{ label: 'Cancelar', cls: 'btn-soft' }, { label: 'Crear código', cls: 'btn-green', onClick: () => { if (!checkTeacherPassword($('#nc-pass').value)) { $('#nc-err').textContent = 'La contraseña no es correcta.'; return false; } const code = newRecoveryCode(); setTimeout(() => showRecoveryCode(code), 0); } }]
  });
};

/* =====================================================================
   LeeOn — 08 APP: rutas (hash), eventos globales y arranque
   Rutas:  #/  #/student  #/student/dashboard  #/student/module/:id
           #/student/activity/:id  #/student/link/:id  #/student/progress  #/student/achievements
           #/student/avatar  #/teacher  #/teacher/dashboard  #/teacher/students
           #/teacher/students/:id  #/teacher/progress  #/teacher/activities  #/teacher/links
           #/teacher/analytics  #/teacher/settings  #/teacher/preview/:id
   ===================================================================== */
function route() {
  if (view.cleanup) { try { view.cleanup(); } catch (e) { console.error(e); } view.cleanup = null; }
  const parts = (location.hash || '#/').replace(/^#/, '').split('/').filter(Boolean);
  if (parts[0] === 'teacher') touchTeacher(); else setTeacherSession(false);   // salir del panel = bloquearlo
  applyPrefs();
  try {
    if (!parts.length) viewHome();
    else if (parts[0] === 'student') routeStudent(parts);
    else if (parts[0] === 'teacher') routeTeacher(parts);
    else viewHome();
  } catch (e) { console.error(e); errorView(); }
  const m = $('#main'); if (m) { m.setAttribute('tabindex', '-1'); try { m.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
}
function routeStudent(p) {
  const st = currentStudent();
  if (!p[1]) return st ? go('#/student/dashboard') : viewStudentLogin();
  if (!st) { setStudentSession(null); return go('#/student'); }
  switch (p[1]) {
    case 'dashboard': return viewDashboard(st);
    case 'module': return viewModule(st, p[2]);
    case 'activity': return viewActivity(p[2], false);
    case 'link': return viewLink(st, p[2]);
    case 'progress': return viewProgress(st);
    case 'achievements': return viewAchievements(st);
    case 'avatar': return viewAvatar(st);
    default: return viewDashboard(st);
  }
}
function routeTeacher(p) {
  /* requireTeacherAuth() es la única puerta hacia cualquier vista docente: si no hay sesión
     vigente, nunca se dibuja el panel (ni el dashboard, ni estudiantes, ni enlaces...). */
  if (!p[1]) return requireTeacherAuth() ? go('#/teacher/dashboard') : viewTeacherLogin();
  if (!requireTeacherAuth()) return go('#/teacher');
  switch (p[1]) {
    case 'dashboard': return viewTDash();
    case 'students': return p[2] ? viewTStudent(p[2]) : viewTStudents();
    case 'progress': return viewTProgress();
    case 'activities': return viewTActivities();
    case 'links': return viewTLinks();
    case 'analytics': return viewTAnalytics();
    case 'settings': return viewTSettings();
    case 'preview': return viewActivity(p[2], true);
    default: return viewTDash();
  }
}

/* Un solo manejador de clics para toda la app: data-go (navegar) y data-act (acciones) */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { e.preventDefault(); try { const r = ACT[a.dataset.act](a, e); if (r && r.catch) r.catch(console.error); } catch (err) { console.error(err); } }
});
window.addEventListener('hashchange', route);
/* Actividad del docente (cada 30 s como máximo) y bloqueo por inactividad */
let lastTouch = 0;
document.addEventListener('click', () => { const n = Date.now(); if (n - lastTouch > 30000) { lastTouch = n; touchTeacher(); } }, true);
setInterval(() => {
  const p = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'teacher' && p[1] && !requireTeacherAuth()) { toast('Por seguridad, el panel se bloqueó.', '🔒'); go('#/teacher'); }
}, 30000);
/* Enlace "Saltar al contenido" (no usa #hash para no chocar con el enrutador) */
const skipBtn = $('#skip'); if (skipBtn) skipBtn.addEventListener('click', () => { const m = $('#main'); if (m) m.focus(); });

/* Arranque */
bootDB();
Voice.init();
applyPrefs();
route();

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
</body>
