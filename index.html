<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1D64CF">
<title>LeeOn · Aprendemos juntos, paso a paso</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* =====================================================================
   LeeOn — estilos
   Tokens de color en :root. Modos de accesibilidad = clases en <html>:
     .lt (texto grande) .hc (alto contraste) .lb (botones grandes)
     .rm (menos movimiento) .calm (modo tranquilo)
   ===================================================================== */
:root{
  --bg:#F3F8FF; --bg2:#E6F0FF; --card:#FFFFFF; --ink:#1A2A4A; --muted:#4B5D84; --line:#C9D9F2;
  --blue:#1D64CF; --blue-soft:#E0ECFF;
  --green:#14815A; --green-soft:#D8F3E6;
  --orange:#C4570B; --orange-soft:#FFE6CF;
  --yellow:#F5C242; --yellow-soft:#FFF3C8;
  --focus:#5B3FD1; --on-accent:#FFFFFF;
  --ok:#14815A; --ok-soft:#D8F3E6; --try-soft:#FFF3C8;
  --shadow:0 6px 20px rgba(26,42,74,.12);
  --r:24px; --btn-h:60px; --bw:3px;
  --font:'Andika','Nunito','Trebuchet MS','Comic Sans MS',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-h:'Fredoka','Andika','Trebuchet MS',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A2E; --bg2:#14233D; --card:#182946; --ink:#EAF1FF; --muted:#AFC0DF; --line:#2C4169;
    --blue:#86B6FF; --blue-soft:#1C3358; --green:#63D6A3; --green-soft:#153A31;
    --orange:#FFAA61; --orange-soft:#45301B; --yellow:#F5C242; --yellow-soft:#43391A;
    --focus:#C3B2FF; --on-accent:#0B1424; --ok:#63D6A3; --ok-soft:#153A31; --try-soft:#43391A;
    --shadow:0 6px 20px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A2E; --bg2:#14233D; --card:#182946; --ink:#EAF1FF; --muted:#AFC0DF; --line:#2C4169;
  --blue:#86B6FF; --blue-soft:#1C3358; --green:#63D6A3; --green-soft:#153A31;
  --orange:#FFAA61; --orange-soft:#45301B; --yellow:#F5C242; --yellow-soft:#43391A;
  --focus:#C3B2FF; --on-accent:#0B1424; --ok:#63D6A3; --ok-soft:#153A31; --try-soft:#43391A;
  --shadow:0 6px 20px rgba(0,0,0,.4);
}
/* Alto contraste: !important en variables para ganar a cualquier tema */
:root.hc{
  --bg:#FFFFFF !important; --bg2:#FFFFFF !important; --card:#FFFFFF !important; --ink:#000000 !important;
  --muted:#000000 !important; --line:#000000 !important; --blue:#0033A0 !important; --blue-soft:#FFFFFF !important;
  --green:#00602F !important; --green-soft:#FFFFFF !important; --orange:#8F3A00 !important; --orange-soft:#FFFFFF !important;
  --yellow:#FFD200 !important; --yellow-soft:#FFF6B8 !important; --focus:#B00020 !important; --on-accent:#FFFFFF !important;
  --ok:#00602F !important; --ok-soft:#E4FFE9 !important; --try-soft:#FFF6B8 !important; --shadow:none !important; --bw:4px !important;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:18px;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.lt{font-size:23px}
html.lb{--btn-h:88px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;min-height:100vh}
h1,h2,h3{font-family:var(--font-h);line-height:1.15;margin:0 0 .4em;font-weight:600}
h1{font-size:2.2rem} h2{font-size:1.6rem} h3{font-size:1.25rem}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:5px solid var(--focus);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-80px;background:var(--card);color:var(--ink);padding:.6rem 1rem;border-radius:12px;z-index:100;border:3px solid var(--focus);cursor:pointer}
.skip:focus{top:8px}
#main:focus{outline:none}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:var(--btn-h);padding:.55rem 1.3rem;border-radius:999px;border:var(--bw) solid transparent;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.14);transition:transform .12s,box-shadow .12s;background:var(--card);color:var(--ink);border-color:var(--line);-webkit-tap-highlight-color:transparent;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn-blue{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.btn-green{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.btn-orange{background:var(--orange);color:var(--on-accent);border-color:var(--orange)}
.btn-soft{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--ink)}
.btn-teacher{background:transparent;border-color:var(--muted);color:var(--muted);box-shadow:none;font-size:.95rem;min-height:calc(var(--btn-h) - 10px)}
.btn-ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn-danger{background:transparent;border-color:var(--orange);color:var(--orange)}
.btn-xl{min-height:calc(var(--btn-h) + 22px);font-size:1.35rem;padding:.8rem 2rem;width:100%;max-width:440px}
.btn-sm{min-height:48px;padding:.35rem .9rem;font-size:.9rem;box-shadow:none}
.icon-btn{min-width:var(--btn-h);padding:.4rem .8rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:1rem;align-items:center}

/* ---------- Tarjetas y estructura ---------- */
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.2rem}
.wrap{max-width:1080px;margin:0 auto;padding:1rem 1rem 3rem}
.topbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:space-between;padding:.7rem 0 1rem}
.topbar .who{display:flex;align-items:center;gap:.6rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .7rem;border-radius:999px;font-size:.8rem;font-weight:700;border:2px solid var(--line);background:var(--card);white-space:nowrap}
.pill.ok{background:var(--ok-soft);border-color:var(--ok)}
.pill.try{background:var(--try-soft);border-color:var(--yellow)}
.pill.lock{background:var(--bg2)}

/* ---------- Inicio ---------- */
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem 1rem;background:radial-gradient(circle at 50% 8%,var(--yellow-soft),transparent 55%),var(--bg)}
.home h1{font-size:3.4rem;margin:.2rem 0}
.lema{font-size:1.35rem;color:var(--muted);margin-bottom:1.4rem}
.welcome-bubble{background:var(--card);border:var(--bw) solid var(--line);border-radius:22px;padding:.5rem 1.1rem;font-weight:700;margin-bottom:.4rem;position:relative}
.home-foot{margin-top:2rem}

/* ---------- León ---------- */
.lion{display:block;flex:none}
.lion svg{display:block;width:100%;height:auto}
.lion.bob svg{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lion-assist{display:flex;align-items:center;gap:1rem}
.bubble{background:var(--card);border:var(--bw) solid var(--line);border-radius:22px;padding:.7rem 1.1rem;font-size:1.15rem;font-weight:700;position:relative;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}

/* ---------- Avatares ---------- */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:var(--bw) solid var(--line);flex:none;overflow:hidden;line-height:1}
.av-tile{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1rem;border:var(--bw) solid var(--line);background:var(--card);border-radius:var(--r);cursor:pointer;min-height:var(--btn-h);font-weight:700}
.av-tile[aria-pressed="true"]{border-color:var(--focus);box-shadow:0 0 0 4px var(--focus)}
.av-tile[aria-pressed="true"]::after{content:"✓ Elegido";font-size:.8rem}

/* ---------- Login estudiante ---------- */
.student-card{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;cursor:pointer;padding:1.2rem;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:1.3rem;min-height:190px;justify-content:center}
.student-card:active{transform:scale(.98)}
.student-card .code{font-size:.9rem;font-weight:400;color:var(--muted)}

/* ---------- Módulos ---------- */
.mod-card{display:flex;flex-direction:column;gap:.6rem;padding:1.4rem;border-radius:var(--r);border:var(--bw) solid transparent;color:var(--on-accent);text-align:left;cursor:pointer;min-height:200px;box-shadow:var(--shadow);width:100%}
.mod-card .big{font-size:3.4rem;line-height:1}
.mod-card h3{font-size:1.6rem;margin:0}
.mod-card .sub{opacity:.95;font-size:.95rem}
.mod-blue{background:var(--blue)} .mod-green{background:var(--green)} .mod-orange{background:var(--orange)}
.mod-card .bar{background:rgba(255,255,255,.35)}
html.hc .mod-card .bar{background:#fff;border-color:#fff}
.mod-card:hover{transform:translateY(-2px)}
.bar{height:16px;border-radius:999px;background:var(--bg2);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--blue);min-width:0;transition:width .5s}
.bar.green>i{background:var(--green)} .bar.orange>i{background:var(--orange)}
.mod-card .bar>i{background:var(--yellow)}
.barline{display:flex;align-items:center;gap:.7rem}
.barline .lbl{min-width:0;flex:0 0 9.5rem;font-weight:700}
.barline .bar{flex:1}
.barline .pct{min-width:3.2rem;text-align:right;font-weight:700}
.reco{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--yellow-soft);border-color:var(--yellow)}
.reco .em{font-size:3rem}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1rem;margin-top:1.4rem}

/* ---------- Página de módulo ---------- */
.mhead{border-radius:var(--r);padding:1.2rem 1.4rem;color:var(--on-accent);margin-bottom:1rem}
.mhead h1{margin:0}
.level-sec{margin:1.6rem 0}
.level-sec h2{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.act-card{position:relative;display:flex;flex-direction:column;gap:.4rem;text-align:left;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--shadow);min-height:170px;cursor:pointer;width:100%}
.act-card .ic{font-size:2.6rem;line-height:1}
.act-card .t{font-weight:700;font-size:1.1rem}
.act-card[aria-disabled="true"]{opacity:.65;cursor:not-allowed;background:var(--bg2)}
.act-card.reco-on{border-color:var(--yellow);box-shadow:0 0 0 4px var(--yellow)}
.ribbon{position:absolute;top:-14px;right:12px;background:var(--yellow);color:#1A2A4A;font-weight:700;font-size:.8rem;border-radius:999px;padding:.15rem .7rem}
.act-card .meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}

/* ---------- Actividad ---------- */
.abar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.6rem 1rem;border-bottom:var(--bw) solid var(--line);flex-wrap:wrap}
.abar .atitle{font-weight:700;flex:1;text-align:center;min-width:120px}
.awrap{max-width:900px;margin:0 auto;padding:1rem 1rem 1rem}
.ins{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ins .instruction{font-size:1.4rem;font-weight:700;margin:0;flex:1;min-width:200px}
.stage{margin-top:1rem;min-height:260px;display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding:1.4rem}
.p-emoji{font-size:5.5rem;line-height:1}
.p-word{font-size:2.6rem;font-weight:700;letter-spacing:.08em;text-align:center}
.frame{font-size:2.6rem;font-weight:700;letter-spacing:.14em;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;justify-content:center}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.5em;border:4px dashed var(--muted);border-radius:14px;padding:0 .2em}
.blank.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.opts{display:grid;gap:1rem;width:100%;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;min-height:130px;padding:.8rem;border-radius:var(--r);border:var(--bw) solid var(--line);background:var(--card);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);font-weight:700;position:relative}
.opt:active{transform:translateY(3px)}
.o-emoji{font-size:3.8rem;line-height:1}
.o-label{font-size:1.7rem;letter-spacing:.06em}
.opt.tried{opacity:.5;background:var(--try-soft);border-style:dashed}
.opt.tried::after{content:"↻ Otra vez";position:absolute;bottom:4px;font-size:.75rem;font-weight:400}
.opt.right{background:var(--ok-soft);border-color:var(--ok);opacity:1}
.opt.right::after{content:"✓";position:absolute;top:6px;right:12px;font-size:1.6rem;color:var(--ok)}
.opt.assist{box-shadow:0 0 0 4px var(--yellow)}
.opt.faded{opacity:.25}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s both}

/* unir */
.match{display:grid;grid-template-columns:1fr 1fr;gap:1rem 2rem;width:100%}
.match .col{display:flex;flex-direction:column;gap:1rem}
.mi{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:96px;padding:.6rem;border-radius:var(--r);border:var(--bw) solid var(--line);background:var(--card);font-weight:700;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);position:relative}
.mi .e{font-size:2.6rem;line-height:1}
.mi[aria-pressed="true"]{border-color:var(--focus);box-shadow:0 0 0 4px var(--focus)}
.mi.done{background:var(--ok-soft);border-color:var(--ok);cursor:default}
.mi .num{position:absolute;top:4px;left:8px;font-size:.85rem;background:var(--ok);color:var(--on-accent);border-radius:999px;padding:0 .5rem}

/* clasificar y armar */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;width:100%}
.bucket{min-height:150px;border:4px dashed var(--muted);border-radius:var(--r);padding:.6rem;display:flex;flex-direction:column;gap:.5rem;align-items:center;background:var(--bg2);cursor:pointer;text-align:center}
.bucket .bl{font-size:2rem;font-weight:700}
.bucket.over{border-color:var(--focus);background:var(--yellow-soft)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.chip{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:.1rem .6rem;font-weight:700;font-size:1.2rem}
.tiles,.slots{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;width:100%;min-height:80px}
.tile,.slot{min-width:76px;min-height:88px;padding:.3rem .9rem;border-radius:18px;font-weight:700;font-size:2rem;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;cursor:pointer;letter-spacing:.06em}
.tile{background:var(--blue-soft);border:var(--bw) solid var(--blue);box-shadow:0 4px 0 rgba(0,0,0,.14);touch-action:none;user-select:none;-webkit-user-select:none}
.tile .te{font-size:2rem;line-height:1}.tile .tl{font-size:1rem;letter-spacing:0}
.tile.dragging{opacity:.35}
.tile.sel{box-shadow:0 0 0 4px var(--focus)}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.92}
.slot{background:var(--bg2);border:4px dashed var(--muted);color:var(--ink)}
.slot.filled{background:var(--blue-soft);border:var(--bw) solid var(--blue)}
.slot.good{background:var(--ok-soft);border-color:var(--ok)}
.slot.check{background:var(--try-soft);border-color:var(--yellow)}
.slot.over{border-color:var(--focus)}
.slots.words .slot,.tiles.words .tile{font-size:1.5rem}
.result-line{font-size:2rem;font-weight:700;letter-spacing:.08em;text-align:center}

/* escritura */
.modes{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;width:100%}
.modes .btn[aria-pressed="true"]{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.write-in{width:100%;max-width:520px;font-size:2rem;font-weight:700;text-align:center;letter-spacing:.08em;padding:.6rem 1rem;border-radius:20px;border:var(--bw) solid var(--blue);background:var(--card);min-height:72px}
.model{font-size:2.6rem;font-weight:700;letter-spacing:.1em;padding:.2rem 1rem;border-radius:16px;border:3px dashed var(--muted);background:var(--bg2)}
.trace-box{position:relative;width:100%;max-width:440px;aspect-ratio:1/.9;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.trace-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* comprensión */
.textcard{width:100%;background:var(--bg2);border-radius:var(--r);padding:1rem 1.2rem;font-size:1.5rem;line-height:1.7}
.textcard .sent{display:block}
.qbox{width:100%;display:flex;flex-direction:column;gap:1rem;align-items:center}
.qbox h3{font-size:1.5rem;text-align:center}
.qcount{font-weight:700;color:var(--muted)}

/* dock (retroalimentación + botones) */
.dock{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:15;margin-top:1rem;background:var(--bg);padding:.6rem 0 .4rem}
.fb{display:flex;align-items:center;gap:.8rem;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);padding:.5rem .8rem;box-shadow:var(--shadow);flex-wrap:wrap}
.fb.good{background:var(--ok-soft);border-color:var(--ok)}
.fb.soft{background:var(--try-soft);border-color:var(--yellow)}
.fb .msg{font-size:1.2rem;font-weight:700;flex:1;min-width:150px}
.fb .acts{display:flex;gap:.5rem;flex-wrap:wrap}
.afoot{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
.done-card{margin-top:1rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8rem;border-color:var(--ok);background:var(--ok-soft)}
.stars{font-size:3rem;letter-spacing:.2em}
.stars span{display:inline-block;animation:pop .5s both}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
.newach{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.newach .pill{font-size:1rem;padding:.3rem .9rem}

/* ---------- Progreso / logros ---------- */
.path-row{margin:.6rem 0 1.4rem}
.path{display:flex;flex-wrap:wrap;gap:.4rem .2rem;align-items:flex-end;padding-top:2.4rem}
.node{position:relative;width:52px;height:52px;border-radius:50%;border:var(--bw) solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin:0 .35rem;font-size:1rem}
.node.done{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.node.lockd{background:var(--bg2);cursor:not-allowed}
.node.next{border-color:var(--yellow);box-shadow:0 0 0 4px var(--yellow)}
.node .lionpin{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:44px;pointer-events:none}
.node .lvl{position:absolute;bottom:-1.3rem;font-size:.65rem;font-weight:400;color:var(--muted);white-space:nowrap}
.stat{text-align:center}
.stat b{display:block;font-size:2.2rem;font-family:var(--font-h)}
.badge{text-align:center;padding:1rem}
.badge .be{font-size:3.4rem;line-height:1}
.badge.off{background:var(--bg2);box-shadow:none}
.badge.off .be{filter:grayscale(1);opacity:.45}
.badge .bn{font-weight:700;margin-top:.3rem}
.badge .bd{font-size:.85rem;color:var(--muted)}

/* ---------- Toast y modal ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:300;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;padding:0 .8rem}
.toast{background:var(--card);border:var(--bw) solid var(--yellow);border-radius:20px;padding:.6rem 1.2rem;font-weight:700;box-shadow:var(--shadow);animation:pop .4s both}
.toast--success{border-color:var(--ok)}
.toast--error{border-color:var(--orange)}
.toast--warning{border-color:var(--yellow)}
.toast--info{border-color:var(--blue)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:250;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:1.4rem;box-shadow:var(--shadow)}
.modal h2{margin-bottom:.8rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;min-height:var(--btn-h);padding:.5rem 1rem;border-radius:18px;border:var(--bw) solid var(--line);background:var(--card);font-weight:700;cursor:pointer;margin-bottom:.6rem;text-align:left}
.toggle .sw{font-size:.9rem;padding:.2rem .8rem;border-radius:999px;background:var(--bg2);border:2px solid var(--line);min-width:4.4rem;text-align:center}
.toggle[aria-checked="true"] .sw{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
textarea.f,input.f,select.f{width:100%;padding:.6rem .9rem;border-radius:16px;border:var(--bw) solid var(--line);background:var(--card);min-height:52px}
label.fl{display:block;font-weight:700;margin:.8rem 0 .3rem}
.err{color:var(--orange);font-weight:700;margin-top:.3rem}
html.hc .err{color:#B00020}

/* ---------- Panel docente ---------- */
.tshell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.tside{background:var(--card);border-right:var(--bw) solid var(--line);padding:1rem;display:flex;flex-direction:column;gap:.4rem;position:sticky;top:0;align-self:start;height:100vh}
.tside .brand{display:flex;align-items:center;gap:.5rem;font-family:var(--font-h);font-size:1.5rem;margin-bottom:.8rem}
.navb{display:flex;align-items:center;gap:.6rem;min-height:52px;padding:.4rem .9rem;border-radius:16px;border:var(--bw) solid transparent;font-weight:700;cursor:pointer;background:transparent;text-align:left;width:100%;text-decoration:none;color:var(--ink)}
.navb[aria-current="page"]{background:var(--blue-soft);border-color:var(--blue)}
.tmain{padding:1.2rem 1.4rem 3rem;min-width:0}
.tmain h1{font-size:1.9rem}
.kpi{display:flex;flex-direction:column;gap:.1rem}
.kpi .n{font-size:2.4rem;font-family:var(--font-h);line-height:1}
.tablewrap{overflow-x:auto;border:var(--bw) solid var(--line);border-radius:18px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:2px solid var(--line);vertical-align:middle}
th{background:var(--bg2);font-family:var(--font-h);white-space:nowrap}
tr:last-child td{border-bottom:0}
.mini{min-width:120px}
.mini .bar{height:12px}
.filters{display:flex;gap:.8rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.filters label{display:flex;flex-direction:column;font-size:.85rem;font-weight:700;gap:.2rem;min-width:150px}
.tally{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.tally .nm{flex:0 0 13rem;font-weight:700;font-size:.9rem}
.tally .seg{display:flex;flex:1;height:18px;border-radius:999px;overflow:hidden;border:2px solid var(--line);background:var(--bg2)}
.tally .seg i{display:block;height:100%}
.tally .seg .g{background:var(--green)} .tally .seg .y{background:var(--yellow)}
.notes li{margin:.4rem 0;padding:.6rem .8rem;border-radius:14px;background:var(--bg2)}
.notes{list-style:none;padding:0;margin:0}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
pre.csv{white-space:pre;overflow:auto;max-height:260px;background:var(--bg2);padding:.6rem;border-radius:12px;font-size:.8rem}

@media (max-width:900px){
  .tshell{grid-template-columns:1fr}
  .tside{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:var(--bw) solid var(--line);align-items:center;padding:.5rem}
  .tside .brand{margin:0 .5rem 0 0;white-space:nowrap}
  .navb{white-space:nowrap;width:auto}
  .tmain{padding:1rem .8rem 3rem}
}
@media (max-width:600px){
  html{font-size:17px}
  h1{font-size:1.8rem} .home h1{font-size:2.8rem}
  .p-emoji{font-size:4.4rem} .p-word,.frame{font-size:2rem}
  .match{gap:.8rem 1rem}
  .mi{font-size:1.2rem;min-height:84px}
  .tile,.slot{min-width:62px;min-height:76px;font-size:1.6rem;padding:.3rem .6rem}
  .lion-assist{flex-direction:column;text-align:center}
  .bubble::before{left:50%;top:-13px;margin:0 0 0 -10px;border:10px solid transparent;border-bottom-color:var(--line);border-top:0}
  .barline .lbl{flex-basis:7rem}
  .tally .nm{flex-basis:8rem}
}

/* ---------- Movimiento reducido y modo tranquilo ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
html.rm *,html.rm *::before,html.rm *::after,
html.calm *,html.calm *::before,html.calm *::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
html.calm .deco{display:none !important}
html.calm body{filter:saturate(.8)}
html.calm .home{background:var(--bg)}

/* ayuda visual en "unir" */
.mi.assist{box-shadow:0 0 0 4px var(--yellow)}

/* atributo hidden siempre oculta */
[hidden]{display:none !important}

/* el atributo hidden debe ganar a display:flex/grid de las clases */
[hidden]{display:none !important}
</style>

<body>
<button type="button" class="skip" id="skip">Saltar al contenido</button>
<div id="toasts" aria-live="polite" role="status"></div>
<div id="app"></div>
<noscript>LeeOn necesita JavaScript para funcionar.</noscript>
<script>
(function () {
'use strict';
/* =====================================================================
   LeeOn — 01 NÚCLEO
   Utilidades, servicio de almacenamiento (localStorage), preferencias,
   voz (Web Speech API) y efectos de sonido suaves.
   ===================================================================== */

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => (p || 'id') + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => (a.length ? sum(a) / a.length : 0);
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-zñ0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
/* Mezcla evitando que el resultado quede igual al orden correcto (si hay más de 1 elemento distinto) */
function shuffleNot(a, keyFn) {
  const k = keyFn || (x => x);
  const target = a.map(k).join('|');
  if (new Set(a.map(k)).size < 2) return a.slice();
  for (let i = 0; i < 20; i++) { const b = shuffle(a); if (b.map(k).join('|') !== target) return b; }
  return a.slice().reverse();
}
const dayKey = d => { const x = new Date(d); return x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate(); };
const fmtDate = iso => { const d = new Date(iso); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const fmtDateShort = iso => { const d = new Date(iso); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
function relDay(iso) {
  if (!iso) return 'Sin actividad';
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(iso); b.setHours(0, 0, 0, 0);
  const n = Math.round((a - b) / 86400000);
  return n <= 0 ? 'Hoy' : n === 1 ? 'Ayer' : 'Hace ' + n + ' días';
}
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec + ' s';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m < 60 ? m + ' min' + (s >= 30 ? ' ' + s + ' s' : '') : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
}

/* ---------- Constantes de módulos ---------- */
const MOD = {
  phonological: { id: 'phonological', name: 'Conciencia fonológica', short: 'Sonidos', dot: '🔵', icon: '👂', cls: 'blue', desc: 'Escucha y juega con los sonidos' },
  reading: { id: 'reading', name: 'Lectura', short: 'Lectura', dot: '🟢', icon: '📖', cls: 'green', desc: 'Lee letras, palabras y cuentos' },
  writing: { id: 'writing', name: 'Escritura', short: 'Escritura', dot: '🟠', icon: '✏️', cls: 'orange', desc: 'Escribe letras, palabras y frases' }
};
const MOD_ORDER = ['phonological', 'reading', 'writing'];
/* "General" no es un módulo de aprendizaje (no tiene actividades ni progreso propio):
   solo sirve para clasificar enlaces que no son de un módulo concreto. Por eso vive
   aparte de MOD/MOD_ORDER y nunca debe agregarse a ese arreglo. Los enlaces "general"
   se muestran siempre en el tablero del estudiante, sin depender de ningún nivel. */
const MOD_GENERAL = { id: 'general', name: 'General', short: 'General', dot: '⭐', icon: '🌟', cls: 'gray', desc: 'Para cualquier momento' };
const MOD_ALL = Object.assign({ general: MOD_GENERAL }, MOD);
/* Nombres de los 5 niveles de cada módulo (para cambiar la progresión edita aquí) */
const LEVEL_NAMES = {
  phonological: ['Escucho y reconozco', 'Sonido inicial', 'Sonido final', 'Sílabas', 'Construyo palabras'],
  reading: ['Letras', 'Sílabas', 'Palabras', 'Oraciones', 'Textos cortos'],
  writing: ['Trazos y letras', 'Copio sílabas y palabras', 'Construyo palabras', 'Construyo frases', 'Escribo lo que veo']
};
const DIFF = { easy: '🟢 Fácil', medium: '🟡 En progreso', challenge: '🔵 Desafío' };

/* ---------- Servicio de almacenamiento ---------- */
const KEYS = {
  students: 'leeon_students',
  results: 'leeon_activity_results',
  prefs: 'leeon_preferences',
  teacher: 'leeon_teacher_session',
  student: 'leeon_student_session',
  links: 'leeon_links',
  teacherAuth: 'leeon_teacher_auth',   // { salt, hash, rsalt, rhash } (solo huellas, nunca la contraseña)
  teacherLock: 'leeon_teacher_lock',   // bloqueo temporal tras intentos fallidos
  seeded: 'leeon_seeded_v1'
};
const memStore = {};       // respaldo en memoria si localStorage no está disponible
let storageOK = true;
function lsRead(key, fallback) {
  try {
    const v = window.localStorage.getItem(key);
    if (v === null) return (!storageOK && key in memStore) ? memStore[key] : fallback;   // la copia en memoria solo se usa si el almacenamiento falló
    return JSON.parse(v);
  } catch (e) { storageOK = false; return key in memStore ? memStore[key] : fallback; }
}
function lsWrite(key, val) {
  memStore[key] = val;
  try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { storageOK = false; console.warn('LeeOn: no se pudo guardar', key); return false; }
}
function lsRemove(key) {
  delete memStore[key];
  try { window.localStorage.removeItem(key); } catch (e) { /* nada */ }
}
function lsHas(key) {
  try { return window.localStorage.getItem(key) !== null; } catch (e) { return key in memStore; }
}

/* Base de datos en memoria (se sincroniza con localStorage en cada cambio) */
const DB = { students: [], results: [], links: [], prefs: null };
const DEFAULT_PREFS = { audioEnabled: true, autoRead: false, reducedMotion: false, largeText: false, highContrast: false, largeButtons: false, calmMode: false };

function getStudents() { return DB.students; }
function saveStudents() { lsWrite(KEYS.students, DB.students); }
function getStudent(id) { return DB.students.find(s => s.id === id) || null; }
function addStudent(data) {
  const st = Object.assign({
    id: uid('st'), name: '', code: '', avatarId: 'lion', createdAt: new Date().toISOString(), level: 1,
    completedActivities: [], achievements: [], preferences: Object.assign({}, DEFAULT_PREFS),
    observations: [], lastAccess: null, avatarChosen: true
  }, data);
  DB.students.push(st); saveStudents(); return st;
}
function updateStudent(id, patch) {
  const st = getStudent(id); if (!st) return null;
  Object.assign(st, patch); saveStudents(); return st;
}
function deleteStudent(id) {
  DB.students = DB.students.filter(s => s.id !== id);
  DB.results = DB.results.filter(r => r.studentId !== id);
  saveStudents(); saveResults();
  if (getSession().student === id) setStudentSession(null);
}
function getActivityResults() { return DB.results; }
function saveResults() { lsWrite(KEYS.results, DB.results); }
function saveActivityResult(res) { DB.results.push(res); saveResults(); return res; }
function resultsFor(studentId) { return DB.results.filter(r => r.studentId === studentId).sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt)); }

/* ---------- Enlaces externos (los agrega cada docente) ---------- */
/* link = { id, title, url, module, level, icon, createdAt } */
function getLinks() { return DB.links; }
function saveLinks() { lsWrite(KEYS.links, DB.links); }
function getLink(id) { return DB.links.find(l => l.id === id) || null; }
function addLink(d) {
  const l = Object.assign({ id: uid('link'), title: '', url: '', module: 'reading', level: 1, icon: '🔗', createdAt: new Date().toISOString() }, d);
  DB.links.push(l); saveLinks(); return l;
}
function updateLink(id, patch) { const l = getLink(id); if (!l) return null; Object.assign(l, patch); saveLinks(); return l; }
function deleteLink(id) { DB.links = DB.links.filter(l => l.id !== id); saveLinks(); }
/* Solo se aceptan direcciones http(s). Si falta el "https://", se agrega. Devuelve null si no es válida. */
function normalizeUrl(raw) {
  let u = String(raw || '').trim(); if (!u) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); if (x.protocol !== 'https:' && x.protocol !== 'http:') return null; if (x.hostname.indexOf('.') < 0) return null; return x.href; }
  catch (e) { return null; }
}
const linkHost = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

function getAccessibilityPreferences() { return Object.assign({}, DEFAULT_PREFS, DB.prefs || {}); }
function saveAccessibilityPreferences(p) { DB.prefs = Object.assign({}, DEFAULT_PREFS, p); lsWrite(KEYS.prefs, DB.prefs); }

/* Sesiones */
/* La sesión docente caduca sola tras 30 min sin actividad y se cierra al salir del panel. */
const TEACHER_IDLE_MS = 30 * 60 * 1000;
function getSession() {
  let t = lsRead(KEYS.teacher, null);
  if (t && (!t.last || Date.now() - t.last > TEACHER_IDLE_MS)) { lsRemove(KEYS.teacher); t = null; }
  return { student: lsRead(KEYS.student, null), teacher: t };
}
function touchTeacher() { const t = getSession().teacher; if (t) { t.last = Date.now(); lsWrite(KEYS.teacher, t); } }   // no revive una sesión ya caducada
function setStudentSession(id) { if (id) lsWrite(KEYS.student, id); else lsRemove(KEYS.student); }
function setTeacherSession(on) { if (on) lsWrite(KEYS.teacher, { teacherId: 'docente-1', since: new Date().toISOString(), last: Date.now() }); else lsRemove(KEYS.teacher); }
/* Guardia única para toda vista/ruta docente: true solo si hay una sesión docente vigente (ver 07a-auth.js para la expiración por inactividad). Ninguna pantalla del panel debe dibujarse sin pasar por aquí primero. */
function requireTeacherAuth() { return !!getSession().teacher; }
function currentStudent() { const id = getSession().student; return id ? getStudent(id) : null; }

/* ---------- Preferencias de accesibilidad ---------- */
/* Si hay un estudiante con sesión se usan sus preferencias; si no, las globales. */
function prefs() {
  const s = currentStudent();
  return Object.assign({}, DEFAULT_PREFS, s ? s.preferences : DB.prefs);
}
function savePrefs(p) {
  const s = currentStudent();
  if (s) { s.preferences = Object.assign({}, DEFAULT_PREFS, p); saveStudents(); }
  else saveAccessibilityPreferences(p);
  applyPrefs();
}
function applyPrefs() {
  const p = prefs(), h = document.documentElement.classList;
  h.toggle('lt', !!p.largeText);
  h.toggle('hc', !!p.highContrast);
  h.toggle('lb', !!p.largeButtons);
  h.toggle('rm', !!p.reducedMotion);
  h.toggle('calm', !!p.calmMode);
}
const motionOK = () => {
  const p = prefs();
  if (p.reducedMotion || p.calmMode) return false;
  try { return !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return true; }
};

/* ---------- Voz (Web Speech API) ---------- */
const Voice = {
  supported: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  last: '', voice: null,
  init() {
    if (!this.supported) return;
    const pickVoice = () => {
      try {
        const vs = window.speechSynthesis.getVoices();
        this.voice = vs.find(v => /^es[-_](CO|MX|US|419)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
      } catch (e) { /* nada */ }
    };
    pickVoice();
    try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (e) { /* nada */ }
  },
  /* opts.user = true → el niño pulsó un botón de audio (suena aunque los sonidos automáticos estén apagados) */
  speak(text, opts) {
    opts = opts || {};
    if (!text) return false;
    this.last = text;
    if (!this.supported) return false;
    if (!opts.user && !prefs().audioEnabled) return false;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = this.voice ? this.voice.lang : 'es-ES';
      if (this.voice) u.voice = this.voice;
      u.rate = opts.rate || 0.85; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  },
  stop() { try { if (this.supported) window.speechSynthesis.cancel(); } catch (e) { /* nada */ } }
};
const speak = (t, o) => Voice.speak(t, o);

/* ---------- Efectos de sonido suaves (WebAudio, volumen bajo) ---------- */
let audioCtx = null;
function sfx(kind) {
  const p = prefs();
  if (!p.audioEnabled || p.calmMode) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const seqs = { ok: [523, 659, 784], badge: [659, 784, 988, 1319], soft: [392, 349] };
    const seq = seqs[kind] || seqs.soft;
    let t = audioCtx.currentTime;
    seq.forEach(f => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.25); t += 0.13;
    });
  } catch (e) { /* sin audio: la app sigue funcionando */ }
}

/* =====================================================================
   LeeOn — 02 DATOS
   Todo el contenido pedagógico vive aquí. Para agregar o cambiar
   actividades NO hay que tocar el motor: solo edita este archivo.
   ===================================================================== */

/* ---------- Avatares (mínimo 8). "lion" se dibuja como SVG (LeeOn). ---------- */
const AVATARS = [
  { id: 'lion', name: 'León', emoji: '🦁', bg: '#FFE2A8' },
  { id: 'panda', name: 'Panda', emoji: '🐼', bg: '#E4E4EC' },
  { id: 'rabbit', name: 'Conejo', emoji: '🐰', bg: '#FFD6E3' },
  { id: 'cat', name: 'Gato', emoji: '🐱', bg: '#FFE0C2' },
  { id: 'dog', name: 'Perro', emoji: '🐶', bg: '#EAD7C4' },
  { id: 'frog', name: 'Rana', emoji: '🐸', bg: '#CDEFC9' },
  { id: 'fox', name: 'Zorro', emoji: '🦊', bg: '#FFD3B0' },
  { id: 'penguin', name: 'Pingüino', emoji: '🐧', bg: '#CFE6FF' }
];

/* ---------- Palabras con imagen (emoji). Formato: clave: [imagen, PALABRA] ---------- */
const W = {
  gato: ['🐱', 'GATO'], perro: ['🐶', 'PERRO'], leon: ['🦁', 'LEÓN'], manzana: ['🍎', 'MANZANA'], sol: ['☀️', 'SOL'],
  mono: ['🐵', 'MONO'], mano: ['✋', 'MANO'], pato: ['🦆', 'PATO'], pan: ['🍞', 'PAN'], sapo: ['🐸', 'SAPO'],
  luna: ['🌙', 'LUNA'], casa: ['🏠', 'CASA'], mariposa: ['🦋', 'MARIPOSA'], pelota: ['⚽', 'PELOTA'], hueso: ['🦴', 'HUESO'],
  agua: ['💧', 'AGUA'],
  /* palabras con sílabas trabadas (dos consonantes seguidas: pl, gl, gr, br, cl, dr, fl, tr…) */
  plato: ['🍽️', 'PLATO'], libro: ['📚', 'LIBRO'], flor: ['🌸', 'FLOR'], tren: ['🚂', 'TREN'], globo: ['🎈', 'GLOBO'],
  dragon: ['🐉', 'DRAGÓN'], grillo: ['🦗', 'GRILLO'], brazo: ['💪', 'BRAZO'], clavo: ['🔩', 'CLAVO']

const actsOf = (mod, level) => ACTIVITIES.filter(a => a.module === mod && (level == null || a.level === level));

/* Cuántos "pasos" tiene una actividad (para calcular aciertos = pasos correctos / intentos) */
function stepsOf(a) {
  const c = a.content || {};
  if (a.type === 'matching') return c.pairs.length;
  if (a.type === 'drag-drop') return c.items.length;
  if (a.type === 'reading-comprehension') return c.questions.length;
  return 1;
}

/* ---------- Progreso ---------- */
function moduleProgress(st, mod) {
  const list = actsOf(mod);
  return Math.round(100 * list.filter(a => st.completedActivities.includes(a.id)).length / list.length);
}
/* Nivel máximo abierto en un módulo: parte del nivel inicial que fijó el docente
   y sube cuando se completan 2 de las 3 actividades del nivel actual. */
function unlockedLevel(st, mod) {
  let L = clamp(st.level || 1, 1, 5);
  while (L < 5) {
    const done = actsOf(mod, L).filter(a => st.completedActivities.includes(a.id)).length;
    if (done >= 2) L++; else break;
  }
  return L;
}
const studentLevel = st => Math.min.apply(null, MOD_ORDER.map(m => unlockedLevel(st, m)));

function getStudentProgress(studentId) {
  const st = getStudent(studentId); if (!st) return null;
  const out = { level: studentLevel(st), completed: st.completedActivities.length, total: ACTIVITIES.length, modules: {} };
  MOD_ORDER.forEach(m => {
    const list = actsOf(m), done = list.filter(a => st.completedActivities.includes(a.id)).length;
    out.modules[m] = { pct: moduleProgress(st, m), done, total: list.length, unlocked: unlockedLevel(st, m) };
  });
  out.avg = Math.round(avg(MOD_ORDER.map(m => out.modules[m].pct)));
  return out;
}

/* ---------- Refuerzo ---------- */
/* Orientación pedagógica (NO es un diagnóstico). results = resultados de UNA actividad, en orden cronológico. */
function reinforcementInfo(results) {
  if (!results.length) return null;
  const rec = results.slice(-3), last = rec[rec.length - 1];
  if (last.completed && last.errors <= 2) return null;           // ya lo logró (con 2 errores o menos): sin alerta
  const att = sum(rec.map(r => r.attempts)), err = sum(rec.map(r => r.errors));
  const acc = att ? 1 - err / att : 1;
  if (err < 2) return null;              // un solo error no es evidencia suficiente
  const reasons = [];
  if (acc < 0.6) reasons.push('Menos del 60% de aciertos');
  if (rec.filter(r => r.errors >= 3).length >= 2) reasons.push('Varios intentos repetidos');
  if (last.errors >= 4) reasons.push('Varias respuestas para revisar');
  return reasons.length ? { acc: Math.round(acc * 100), reasons } : null;
}
function getActivitiesNeedingReinforcement(studentId) {
  const rs = resultsFor(studentId), out = [];
  ACTIVITIES.forEach(a => {
    const info = reinforcementInfo(rs.filter(r => r.activityId === a.id));
    if (info) out.push({ activity: a, info });
  });
  return out;
}

/* Estado de todas las actividades para un estudiante: locked | available | in-progress | completed | reinforcement */
function statusMap(st) {
  const rs = resultsFor(st.id), by = {}, map = {};
  rs.forEach(r => { (by[r.activityId] = by[r.activityId] || []).push(r); });
  const unl = {}; MOD_ORDER.forEach(m => { unl[m] = unlockedLevel(st, m); });
  ACTIVITIES.forEach(a => {
    if (a.level > unl[a.module]) map[a.id] = 'locked';
    else if (reinforcementInfo(by[a.id] || [])) map[a.id] = 'reinforcement';
    else if (st.completedActivities.includes(a.id)) map[a.id] = 'completed';
    else if ((by[a.id] || []).length) map[a.id] = 'in-progress';
    else map[a.id] = 'available';
  });
  return map;
}

/* ---------- Recomendación (nunca bloquea: el niño puede elegir otra) ---------- */
function recommendNextActivity(studentId) {
  const st = getStudent(studentId); if (!st) return null;
  const sm = statusMap(st);
  const done = resultsFor(studentId).filter(r => r.completed && !r.link);   // los enlaces externos no cuentan para recomendar
  const last3 = done.slice(-3);
  // 1) Si los últimos resultados fueron bajos → reforzar con calma
  if (last3.length && avg(last3.map(r => r.score)) < 60) {
    const weakest = last3.slice().sort((a, b) => a.score - b.score)[0];
    const a = actById(weakest.activityId);
    if (a) return { activity: a, kind: 'reinforce', reason: 'Vamos a practicar esta otra vez, con calma.' };
  }
  const todo = ACTIVITIES.filter(a => sm[a.id] !== 'locked' && !st.completedActivities.includes(a.id));
  const lastAct = done.length ? actById(done[done.length - 1].activityId) : null;
  const lastMod = lastAct ? lastAct.module : null;
  const strong = last3.length === 3 && last3.every(r => r.score >= 80);   // 80% o más en 3 actividades
  const byProgress = MOD_ORDER.slice().sort((x, y) => moduleProgress(st, x) - moduleProgress(st, y));
  const order = strong && lastMod ? [lastMod].concat(byProgress.filter(m => m !== lastMod)) : byProgress;
  for (const m of order) {
    const t = todo.find(a => a.module === m);
    if (t) return { activity: t, kind: strong ? 'next' : 'continue', reason: strong ? '¡Vas muy bien! Este es el siguiente paso.' : (done.length ? 'Sigue con tu camino.' : '¡Empecemos juntos!') };
  }
  // 2) Todo lo disponible está completo → practicar lo más flojo
  const best = {}; done.forEach(r => { best[r.activityId] = Math.max(best[r.activityId] || 0, r.score); });
  const list = Object.keys(best).sort((a, b) => best[a] - best[b]);
  const a = list.length ? actById(list[0]) : ACTIVITIES[0];
  return { activity: a, kind: 'practice', reason: '¡Has completado todo lo abierto! Practiquemos otra vez.' };
}

/* ---------- Logros ---------- */
function achContext(st) {
  const done = st.completedActivities, has = id => done.includes(id);
  const days = new Set(resultsFor(st.id).map(r => dayKey(r.completedAt || r.startedAt))).size;
  return {
    done, days,
    n: m => actsOf(m).filter(a => has(a.id)).length,
    level: (m, L) => actsOf(m, L).every(a => has(a.id)),
    anyLevel: (m, L) => actsOf(m, L).some(a => has(a.id))
  };
}
function evaluateAchievements(st) {
  const c = achContext(st), fresh = [];
  ACHIEVEMENTS.forEach(a => {
    if (!st.achievements.includes(a.id) && a.test(c)) { st.achievements.push(a.id); fresh.push(a); }
  });
  return fresh;
}

/* Guarda el resultado, actualiza progreso y logros. Devuelve los logros nuevos. */
function recordActivityResult(res) {
  saveActivityResult(res);
  const st = getStudent(res.studentId); if (!st) return { fresh: [] };
  if (res.completed && !st.completedActivities.includes(res.activityId)) st.completedActivities.push(res.activityId);
  st.lastAccess = res.completedAt || res.startedAt;
  const fresh = evaluateAchievements(st);
  saveStudents();
  return { fresh };
}

/* ---------- Analítica ---------- */
const isOk = r => r.completed && r.score >= 60;
function getStudentAnalytics(studentId) {
  const st = getStudent(studentId); if (!st) return null;
  const rs = resultsFor(studentId), own = rs.filter(r => !r.link), bySkill = {};
  own.forEach(r => {
    const a = actById(r.activityId); if (!a) return;
    const s = bySkill[a.skill] = bySkill[a.skill] || { skill: a.skill, module: a.module, ok: 0, not: 0 };
    isOk(r) ? s.ok++ : s.not++;
  });
  const skills = Object.values(bySkill);
  const attempts = sum(own.map(r => r.attempts)), errors = sum(own.map(r => r.errors));
  const last = rs[rs.length - 1];
  const reinforcement = getActivitiesNeedingReinforcement(studentId);
  // Patrones: habilidades con al menos 2 registros y menos del 70% de éxito
  const patterns = skills.filter(s => s.ok + s.not >= 2 && s.ok / (s.ok + s.not) < 0.7)
    .sort((a, b) => a.ok / (a.ok + a.not) - b.ok / (b.ok + b.not)).slice(0, 3)
    .map(s => 'Presenta mayor dificultad en ' + s.skill.charAt(0).toLowerCase() + s.skill.slice(1) + '.');
  return {
    totalResults: rs.length, completed: rs.filter(r => r.completed).length,
    distinctDone: st.completedActivities.length, linksDone: rs.filter(r => r.link).length,
    attempts, errors, hints: sum(own.map(r => r.hintsUsed)),
    accuracy: attempts ? Math.round(100 * (1 - errors / attempts)) : 0,
    timeSec: sum(rs.map(r => r.durationSeconds)),
    lastAccess: last ? (last.completedAt || last.startedAt) : st.lastAccess,
    skills, reinforcement, patterns
  };
}
function getGroupSummary() {
  const sts = getStudents(), week = Date.now() - 7 * 86400000;
  const rs = getActivityResults();
  const activeIds = new Set(rs.filter(r => new Date(r.startedAt).getTime() >= week).map(r => r.studentId));
  const progs = sts.map(s => getStudentProgress(s.id));
  const mods = {}; MOD_ORDER.forEach(m => { mods[m] = Math.round(avg(progs.map(p => p.modules[m].pct))); });
  return {
    students: sts.length, active: sts.filter(s => activeIds.has(s.id)).length,
    done: rs.length, completed: rs.filter(r => r.completed).length,
    avg: Math.round(avg(progs.map(p => p.avg))), mods
  };
}

/* ---------- Enlaces externos ---------- */
/* Un resultado puede venir de una actividad de LeeOn o de un enlace del docente (r.link === true). */
function resultActivity(r) {
  const a = actById(r.activityId); if (a) return a;
  if (r.link) return { id: 'ENLACE', title: r.linkTitle || 'Enlace', module: r.module, level: r.level || 1, skill: 'Actividad externa' };
  return null;
}
const linksOf = (mod, level) => getLinks().filter(l => l.module === mod && (level == null || l.level === level));
/* Registra que el niño abrió el enlace y marcó "Ya terminé". No hay puntaje: LeeOn no recibe resultados de la otra página.
   No cambia el % de progreso del módulo, pero sí cuenta como participación y como día de aprendizaje. */
function recordLinkParticipation(studentId, link, durationSeconds, startedAtIso) {
  const st = getStudent(studentId); if (!st) return { fresh: [] };
  const now = new Date().toISOString();
  saveActivityResult({
    id: uid('res'), studentId, activityId: link.id, module: link.module, level: link.level, link: true, linkTitle: link.title,
    score: 100, attempts: 0, errors: 0, hintsUsed: 0, completed: true,
    durationSeconds: Math.max(1, Math.round(durationSeconds || 1)), startedAt: startedAtIso || now, completedAt: now
  });
  st.lastAccess = now;
  const fresh = evaluateAchievements(st);
  saveStudents();
  return { fresh };
}

/* ---------- Exportación CSV ---------- */
function buildCSV(rows) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['Estudiante', 'Fecha', 'Módulo', 'Actividad', 'Resultado', 'Puntaje', 'Intentos', 'Pistas', 'Duración (s)'];
  const lines = [head.map(q).join(',')];
  rows.forEach(r => {
    const st = getStudent(r.studentId), a = resultActivity(r);
    lines.push([st ? st.name : '?', fmtDate(r.startedAt), MOD_ALL[r.module].name, a ? (r.link ? '🔗 ' : a.id + ' ') + a.title : r.activityId,
      r.completed ? 'Completada' : 'En progreso', r.score, r.attempts, r.hintsUsed, r.durationSeconds].map(q).join(','));
  });
  return lines.join('\n');
}

/* ---------- Datos de demostración ---------- */
function rng(seed) { // generador pseudoaleatorio con semilla (resultados demo reproducibles)
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function seedDemo() {
  const rand = rng(20260920), DAY = 86400000, now = Date.now();
  const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const profiles = [
    { name: 'Ana', code: '1234', avatarId: 'lion', level: 1, counts: { phonological: 12, reading: 11, writing: 8 }, weak: ['Completar palabras'], span: 9, last: 0,
      obs: [{ d: 4, t: 'Lee palabras frecuentes con autonomía.' }] },
    { name: 'Mateo', code: '2345', avatarId: 'panda', level: 1, counts: { phonological: 10, reading: 9, writing: 6 }, weak: ['Identificación del sonido final'], span: 6, last: 1,
      prefs: { calmMode: true, reducedMotion: true }, obs: [{ d: 3, t: 'Necesita apoyo para reconocer sonidos finales.' }] },
    { name: 'Sofía', code: '3456', avatarId: 'rabbit', level: 1, counts: { phonological: 9, reading: 12, writing: 10 }, weak: ['Construcción de palabras'], span: 5, last: 0, obs: [] },
    { name: 'Juan', code: '4567', avatarId: 'frog', level: 1, counts: { phonological: 5, reading: 3, writing: 2 }, weak: ['Clasificación por sonido inicial', 'Reconocimiento de letras'], span: 2, last: 4,
      prefs: { autoRead: true, largeButtons: true, largeText: true }, obs: [{ d: 4, t: 'Requiere apoyo visual para construir frases.' }] }
  ];
  DB.students = []; DB.results = [];
  profiles.forEach((p, pi) => {
    const st = {
      id: 'demo-' + p.code, name: p.name, code: p.code, avatarId: p.avatarId, createdAt: new Date(now - (p.span + p.last + 2) * DAY).toISOString(),
      level: p.level, completedActivities: [], achievements: [], preferences: Object.assign({}, DEFAULT_PREFS, p.prefs || {}),
      observations: p.obs.map(o => ({ id: uid('ob'), date: new Date(now - o.d * DAY).toISOString(), text: o.t, teacherId: 'docente-1' })),
      lastAccess: null, avatarChosen: true
    };
    let weakSeen = 0;
    MOD_ORDER.forEach(m => {
      const list = actsOf(m).slice(0, p.counts[m]);
      list.forEach((a, j) => {
        const f = (j + 0.5) / Math.max(1, list.length);
        const daysAgo = p.last + Math.round((1 - f) * (p.span - 1));
        const weak = p.weak.indexOf(a.skill) >= 0;
        let minute = 0;
        const mk = (errors, hints, completed) => {
          const steps = stepsOf(a);
          const t0 = new Date(now - daysAgo * DAY); t0.setHours(9 + (pi % 3), 5 + ((j * 7 + pi * 11) % 40) + minute, 0, 0);
          if (t0.getTime() > now) t0.setTime(now - (list.length - j + 1) * 6 * 60000);
          minute += 15;
          const dur = Math.round(a.estimatedTime * 60 * (0.5 + rand()) + errors * 12);
          st.completedActivities.indexOf(a.id) < 0 && completed && st.completedActivities.push(a.id);
          DB.results.push({
            id: uid('res'), studentId: st.id, activityId: a.id, module: m,
            score: completed ? clamp(100 - 15 * errors - 6 * hints, 40, 100) : 0,
            attempts: completed ? steps + errors : errors, errors, hintsUsed: hints, completed,
            durationSeconds: dur, startedAt: t0.toISOString(), completedAt: completed ? new Date(t0.getTime() + dur * 1000).toISOString() : undefined
          });
        };
        if (weak) {
          if (rand() < 0.5) mk(ri(1, 2), 0, false);
          mk(ri(3, 5), ri(1, 2), true);
          weakSeen++;
          if (weakSeen > 1 && rand() < 0.4) mk(0, 0, true);   // la 1.ª queda como "requiere práctica"; algunas siguientes se recuperan
        } else {
          if (rand() < 0.12) mk(1, 0, false);
          const e = rand() < 0.28 ? 1 : (rand() < 0.08 ? 2 : 0);
          mk(e, e && rand() < 0.3 ? 1 : 0, true);
        }
      });
    });
    const mine = DB.results.filter(r => r.studentId === st.id);
    st.lastAccess = mine.map(r => r.completedAt || r.startedAt).sort().pop() || null;
    evaluateAchievements(st);
    DB.students.push(st);
  });
  saveStudents(); saveResults();
  saveAccessibilityPreferences(DEFAULT_PREFS);
  lsWrite(KEYS.seeded, true);
}
function restoreDemo() {
  setStudentSession(null);
  seedDemo();
}
function clearLocalData() {
  setStudentSession(null);
  DB.students = []; DB.results = []; DB.links = [];
  saveStudents(); saveResults(); saveLinks();
  saveAccessibilityPreferences(DEFAULT_PREFS);
  lsWrite(KEYS.seeded, true);   // evita que se vuelvan a cargar los datos demo automáticamente
}
/* Carga los datos al abrir la app; si es la primera vez, crea los datos demo. */
function bootDB() {
  const first = !lsHas(KEYS.students) && !lsRead(KEYS.seeded, false);
  const ss = lsRead(KEYS.students, []), rs = lsRead(KEYS.results, []);
  DB.students = Array.isArray(ss) ? ss : [];
  DB.results = Array.isArray(rs) ? rs : [];
  const ls = lsRead(KEYS.links, []);
  DB.links = Array.isArray(ls) ? ls.filter(l => l && l.id && normalizeUrl(l.url) && MOD_ALL[l.module]) : [];
  DB.students.forEach(s => {          // migración defensiva: asegura todos los campos
    s.completedActivities = s.completedActivities || []; s.achievements = s.achievements || [];
    s.observations = s.observations || []; s.preferences = Object.assign({}, DEFAULT_PREFS, s.preferences || {});
    s.level = clamp(+s.level || 1, 1, 5);
  });
  DB.prefs = Object.assign({}, DEFAULT_PREFS, lsRead(KEYS.prefs, {}) || {});
  if (first) seedDemo();
  return first;
}

/* =====================================================================
   LeeOn — 04 COMPONENTES DE INTERFAZ
   León (SVG con emociones), avatares, barras, modal, avisos y panel
   de accesibilidad. Cada componente devuelve HTML (string) o abre un modal.
   ===================================================================== */

/* ---------- León LeeOn ---------- */
/* mood: happy | thinking | encouraging | celebrating | neutral | surprised */
function lionSVG(mood) {
  mood = mood || 'happy';
  const M = '#E8902E', MD = '#C9701A', ink = '#2B1B12';
  let petals = '';
  for (let i = 0; i < 14; i++) {
    const ang = i / 14 * Math.PI * 2;
    petals += `<circle cx="${(100 + Math.cos(ang) * 64).toFixed(1)}" cy="${(104 + Math.sin(ang) * 64).toFixed(1)}" r="25" fill="${M}" stroke="${MD}" stroke-width="2"/>`;
  }
  const eye = (cx, cy, rx, ry, px, py) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${ink}"/><circle cx="${cx + 2 + (px || 0)}" cy="${cy - 3 + (py || 0)}" r="2.4" fill="#fff"/>`;
  const line = d => `<path d="${d}" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const star = (cx, cy, r, f) => { let p = ''; for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5; p += (cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1) + ' '; } return `<polygon points="${p}" fill="${f}"/>`; };
  let eyes = '', mouth = '', extra = '';
  const smile = line('M86 137 Q100 152 114 137');
  if (mood === 'celebrating') {
    eyes = line('M71 102 Q80 89 89 102') + line('M111 102 Q120 89 129 102');
    mouth = `<path d="M85 135 Q100 162 115 135 Z" fill="#7A2E1B"/><ellipse cx="100" cy="148" rx="9" ry="5" fill="#FF8DA1"/>`;
    extra = `<g class="deco">${star(28, 34, 11, '#FFD84D')}${star(176, 26, 9, '#FF8DA1')}${star(184, 88, 7, '#7FD6FF')}${star(16, 92, 7, '#9BE38F')}</g>`;
  } else if (mood === 'thinking') {
    eyes = eye(80, 99, 6, 7.5, 2, -2) + eye(120, 99, 6, 7.5, 2, -2) + line('M69 83 Q80 75 91 82') + line('M110 87 Q120 84 130 88');
    mouth = line('M91 141 Q104 147 113 138');
    extra = `<g class="deco"><circle cx="152" cy="52" r="3.5" fill="#fff" stroke="${MD}"/><circle cx="160" cy="42" r="5" fill="#fff" stroke="${MD}"/><circle cx="172" cy="28" r="15" fill="#fff" stroke="${MD}" stroke-width="2"/><text x="172" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1A2A4A" font-family="sans-serif">?</text></g>`;
  } else if (mood === 'encouraging') {
    eyes = eye(80, 98, 6.5, 8) + eye(120, 98, 6.5, 8) + line('M69 87 Q79 79 91 81') + line('M109 81 Q121 79 131 87');
    mouth = smile;
    extra = `<g class="deco"><path d="M176 50 C162 39 167 27 176 34 C185 27 190 39 176 50Z" fill="#FF6B81"/></g>`;
  } else if (mood === 'surprised') {
    eyes = eye(80, 98, 8, 10) + eye(120, 98, 8, 10);
    mouth = `<ellipse cx="100" cy="143" rx="7" ry="9" fill="#7A2E1B"/>`;
  } else if (mood === 'neutral') {
    eyes = eye(80, 99, 6, 7) + eye(120, 99, 6, 7);
    mouth = line('M90 139 Q100 145 110 139');
  } else { // happy
    eyes = eye(80, 98, 6.5, 8) + eye(120, 98, 6.5, 8);
    mouth = smile;
  }
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
${petals}<circle cx="100" cy="104" r="66" fill="${M}"/>
<circle cx="54" cy="58" r="18" fill="#F2B04D" stroke="${MD}" stroke-width="2"/><circle cx="54" cy="58" r="9" fill="#FF9F8F"/>
<circle cx="146" cy="58" r="18" fill="#F2B04D" stroke="${MD}" stroke-width="2"/><circle cx="146" cy="58" r="9" fill="#FF9F8F"/>
<ellipse cx="100" cy="108" rx="56" ry="52" fill="#FFC95C" stroke="#E9A93A" stroke-width="2"/>
<ellipse cx="100" cy="132" rx="30" ry="22" fill="#FFF1D0"/>
<circle cx="66" cy="124" r="9" fill="#FF9E8A" opacity=".45"/><circle cx="134" cy="124" r="9" fill="#FF9E8A" opacity=".45"/>
${eyes}
<path d="M90 116 Q100 109 110 116 Q109 126 100 129 Q91 126 90 116Z" fill="#B8533A"/>
<path d="M100 129 L100 136" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
${mouth}${extra}</svg>`;
}
function lionFig(mood, size, bob) {
  return `<span class="lion${bob && motionOK() ? ' bob' : ''}" style="width:${size || 120}px" role="img" aria-label="LeeOn, el león amigo">${lionSVG(mood)}</span>`;
}
/* Componente LionAssistant: león + globo de mensaje */
function lionAssistant(mood, message, sub, size) {
  return `<div class="lion-assist">${lionFig(mood, size || 120, true)}<div class="bubble" role="status">${esc(message)}${sub ? `<small>${esc(sub)}</small>` : ''}</div></div>`;
}

/* ---------- Avatar ---------- */
function avatarHTML(id, size) {
  size = size || 64;
  const a = AVATARS.find(x => x.id === id) || AVATARS[0];
  const inner = a.id === 'lion' ? `<span style="width:${Math.round(size * .9)}px;display:block">${lionSVG('happy')}</span>` : `<span style="font-size:${Math.round(size * .58)}px" aria-hidden="true">${a.emoji}</span>`;
  return `<span class="avatar" style="width:${size}px;height:${size}px;background:${a.bg}" role="img" aria-label="Avatar ${esc(a.name)}">${inner}</span>`;
}

/* ---------- Barras de progreso (siempre con el porcentaje escrito: no dependen del color) ---------- */
function bar(pct, cls, label) {
  pct = clamp(Math.round(pct || 0), 0, 100);
  return `<div class="bar ${cls || ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${esc(label || 'Progreso')}"><i style="width:${pct}%"></i></div>`;
}
function barLine(label, pct, cls) {
  return `<div class="barline"><span class="lbl">${esc(label)}</span>${bar(pct, cls, label)}<span class="pct">${Math.round(pct)}%</span></div>`;
}

/* ---------- Avisos no invasivos ---------- */
/* toast(texto, emoji, tipo?) — tipo solo cambia el color del borde (success|error|warning|info); no cambia el texto ni el emoji, así que sigue funcionando igual para cualquier llamada existente que no lo use. */
function toast(text, emoji, kind) {
  const host = $('#toasts'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.setAttribute('role', kind === 'error' || kind === 'warning' ? 'alert' : 'status');
  el.textContent = (emoji ? emoji + ' ' : '') + text;
  host.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
/* showToast(mensaje, tipo) — confirmación reutilizable para el panel docente.
   tipo: 'success' (✅), 'error' (⛔), 'warning' (⚠️) o 'info' (🦁). El mensaje ya debe
   traer su propio texto (p. ej. showToast('Estudiante actualizado.', 'success')). */
function showToast(message, kind) {
  const EMOJI = { success: '✅', error: '⛔', warning: '⚠️', info: '🦁' };
  toast(message, EMOJI[kind] || '', kind || 'info');
}

/* ---------- Modal accesible (foco atrapado, Esc para cerrar) ---------- */
function openModal(opt) {
  const prev = document.activeElement;
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  const id = uid('mt');
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${id}"><h2 id="${id}">${opt.title || ''}</h2><div class="mbody">${opt.html || ''}</div><div class="row" style="margin-top:1rem;justify-content:flex-end" id="${id}-acts"></div></div>`;
  document.body.appendChild(bg);
  const box = $('.modal', bg);
  const api = {
    el: box,
    close() { bg.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* nada */ } } if (opt.onClose) opt.onClose(); }
  };
  const acts = $('#' + id + '-acts', bg);
  (opt.actions || [{ label: 'Cerrar', cls: 'btn-soft' }]).forEach(a => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (a.cls || 'btn-soft'); b.textContent = a.label;
    b.addEventListener('click', () => { if (a.onClick) { const keep = a.onClick(api); if (keep === false) return; } api.close(); });
    acts.appendChild(b);
  });
  function onKey(e) {
    if (e.key === 'Escape') { e.stopPropagation(); api.close(); return; }
    if (e.key === 'Tab') {
      const f = $$('button,input,select,textarea,[href],[tabindex]:not([tabindex="-1"])', box).filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  document.addEventListener('keydown', onKey, true);
  bg.addEventListener('mousedown', e => { if (e.target === bg) api.close(); });
  const f0 = $('input,select,textarea,.mbody button', box) || $('button', box); if (f0) f0.focus();
  return api;
}
function confirmDialog(title, text, yes, no) {
  return new Promise(res => {
    let answered = false;
    openModal({
      title, html: `<p>${text}</p>`,
      actions: [
        { label: no || 'Cancelar', cls: 'btn-soft', onClick: () => { answered = true; res(false); } },
        { label: yes || 'Sí', cls: 'btn-orange', onClick: () => { answered = true; res(true); } }
      ],
      onClose: () => { if (!answered) res(false); }
    });
  });
}
